<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dither Field · 语音面板概念 B（抖动 / Dithering）</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f2f2f0;
    --muted: #8d8d88;
    --ease: cubic-bezier(.22,.61,.36,1);
    font-family: -apple-system, "SF Pro Text", "PingFang SC", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #050505; overflow: hidden; }
  #field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .overlay {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
    text-align: center; pointer-events: none; color: var(--ink); z-index: 2;
  }
  /* A soft scrim keeps the copy readable without hiding the dither field. */
  .scrim {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(56% 44% at 50% 44%, rgb(5 5 5 / .95) 0%, rgb(5 5 5 / .82) 40%, rgb(5 5 5 / .35) 68%, transparent 100%);
  }
  .kicker {
    font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted);
  }
  .title {
    margin: 0; font-size: clamp(22px, 4.4vw, 40px); font-weight: 600; letter-spacing: -.02em;
    text-shadow: 0 1px 18px rgb(0 0 0 / .8);
  }
  .body { margin: 0; font-size: 13px; color: var(--muted); max-width: 30ch; margin-inline: auto; line-height: 1.6; }

  .dots { display: flex; gap: 7px; justify-content: center; margin-top: 4px; }
  .dots i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ink);
    animation: blink 1.25s var(--ease) infinite;
  }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 100% { opacity: .18; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

  .hud {
    position: fixed; left: 22px; right: 22px; bottom: 20px; display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted);
  }
  .hud .tag { border: 1px solid #2a2a2a; border-radius: 999px; padding: 3px 9px; }
  .states { margin-left: auto; display: flex; gap: 6px; }
  .states button {
    font: inherit; font-size: 11.5px; color: var(--muted); background: transparent;
    border: 1px solid #2a2a2a; border-radius: 999px; padding: 4px 10px; cursor: pointer;
    transition: all 160ms var(--ease);
  }
  .states button:hover { color: var(--ink); border-color: #565656; }
  .states button[aria-pressed="true"] { color: #050505; background: var(--ink); border-color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<div class="scrim" aria-hidden="true"></div>
<div class="overlay">
  <span class="kicker">1-bit · bayer 8×8</span>
  <h1 class="title" id="title">正在听你说</h1>
  <p class="body" id="body">这个“黑白底 + 闪烁马赛克点”的效果叫抖动（Dithering），用有序 Bayer 矩阵把连续灰度压成两色</p>
  <div class="dots" id="dots"><i></i><i></i><i></i></div>
</div>

<div class="hud">
  <span class="tag">概念 B · 抖动场</span>
  <span>切换状态看场形如何变化 · 键盘 1–4</span>
  <div class="states" role="group" aria-label="状态演示">
    <button type="button" data-state="listening" aria-pressed="true">收听</button>
    <button type="button" data-state="thinking" aria-pressed="false">思考</button>
    <button type="button" data-state="processing" aria-pressed="false">处理</button>
    <button type="button" data-state="done" aria-pressed="false">完成</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d', { alpha: false });
  const title = document.getElementById('title');
  const body = document.getElementById('body');
  const dots = document.getElementById('dots');
  const buttons = [...document.querySelectorAll('.states button')];

  // 8×8 ordered Bayer matrix: thresholds for each cell.
  const BAYER = [
    0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26,
    12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
    3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
    15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21,
  ].map(value => (value + 0.5) / 64);

  const copy = {
    listening: ['正在听你说', '振幅随声音起伏：把声压当灰度，再用 Bayer 矩阵压成两色点阵'],
    thinking: ['在想…', '场形变成旋涡，代表正在检索与比对而非在“听”'],
    processing: ['正在打开…', '一条扫描带把画面推向终点，读作“正在执行”'],
    done: ['已打开', '场形散开、点阵变稀，提示任务结束、窗口即将消失'],
  };

  let state = 'listening';
  let started = at = performance.now();
  let cell = 6;
  let columns = 0, rows = 0;
  let image = null;

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.floor(innerWidth * ratio), height = Math.floor(innerHeight * ratio);
    canvas.width = width; canvas.height = height;
    cell = Math.max(3, Math.round(6 * ratio));
    columns = Math.ceil(width / cell); rows = Math.ceil(height / cell);
    image = ctx.createImageData(columns, rows);
  }
  addEventListener('resize', resize);

  const mix = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);

  function field(x, y, t) {
    const nx = x / columns, ny = y / rows;
    if (state === 'listening') {
      // Concentric rings whose radius breathes with the pseudo voice level.
      const level = 0.45 + 0.35 * Math.sin(t * 1.4);
      const dx = nx - 0.5, dy = ny - 0.5;
      const radius = Math.hypot(dx * 1.6, dy);
      return 0.5 + 0.5 * Math.sin(radius * 26 - t * 2.2) * (1 - Math.min(1, radius * 1.5)) * level + level * 0.3;
    }
    if (state === 'thinking') {
      // Swirl: angle grows with radius.
      const dx = nx - 0.5, dy = ny - 0.5;
      const angle = Math.atan2(dy, dx);
      const radius = Math.hypot(dx, dy);
      return 0.5 + 0.45 * Math.sin(angle * 3 + radius * 30 - t * 1.6) * (1 - Math.min(1, radius * 1.4));
    }
    if (state === 'processing') {
      // A scan band travelling left to right, plus a faint grid.
      const band = ((t * 0.55) % 1.4) - 0.2;
      const distance = Math.abs(nx - band);
      const sweep = Math.max(0, 1 - distance * 6);
      const grid = (Math.sin(nx * 90) * Math.sin(ny * 70)) * 0.12;
      return 0.28 + sweep * 0.72 + grid;
    }
    // done: dissolve outward, thinning the ink.
    const dx = nx - 0.5, dy = ny - 0.5;
    const radius = Math.hypot(dx, dy);
    return 0.5 + 0.5 * Math.sin(radius * 34 - t * 1.1) * Math.max(0, 1 - t * 0.5) * 0.9;
  }

  function draw(now) {
    if (!image) return;
    const t = (now - started) / 1000;
    const data = image.data;
    let index = 0;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < columns; x++) {
        // Bias the whole field darker so it reads as ink on black, not paper on black.
        const value = Math.min(1, Math.max(0, field(x, y, t) * 0.82 - 0.16));
        const threshold = BAYER[(y % 8) * 8 + (x % 8)];
        // Ordered dithering: a cell is inked when its value clears its threshold.
        const ink = value > threshold * 0.92 + 0.04;
        data[index++] = ink ? 242 : 5;
        data[index++] = ink ? 242 : 5;
        data[index++] = ink ? 240 : 5;
        data[index++] = 255;
      }
    }
    ctx.putImageData(image, 0, 0, 0, 0, columns, rows);
    // Scale the small buffer up without smoothing so the dots stay crisp.
    ctx.imageSmoothingEnabled = false;
    const w = canvas.width, h = canvas.height;
    if (columns * cell !== w || rows * cell !== h) {
      ctx.drawImage(canvas, 0, 0, columns, rows, 0, 0, columns * cell, rows * cell);
    }
    requestAnimationFrame(draw);
  }

  function setState(next) {
    state = next;
    started = performance.now();
    title.textContent = copy[next][0];
    body.textContent = copy[next][1];
    dots.style.visibility = next === 'thinking' ? 'visible' : 'hidden';
    for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.state === next));
  }

  for (const button of buttons) button.addEventListener('click', () => setState(button.dataset.state));
  addEventListener('keydown', event => {
    const map = { '1': 'listening', '2': 'thinking', '3': 'processing', '4': 'done' };
    if (map[event.key]) setState(map[event.key]);
  });

  resize();
  setState('listening');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    // Render one static frame instead of animating.
    const now = performance.now();
    draw(now);
    cancelAnimationFrame(1);
  } else {
    requestAnimationFrame(draw);
  }
</script>
</body>
</html>
