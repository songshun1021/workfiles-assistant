<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语音面板 · 配色横向对比</title>
<style>
  :root {
    --ease: cubic-bezier(.22,.61,.36,1);
    font-family: "SF Pro Text", -apple-system, "PingFang SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #0e0f12;
    color: #e9eaee;
    padding: 22px 24px 40px;
    display: grid; gap: 18px;
  }

  /* ---------- shared chrome ---------- */
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .bar .hint { font-size: 12px; color: #868c99; }
  .bar .spacer { flex: 1; }
  .states { display: flex; gap: 6px; }
  .states button {
    font: inherit; font-size: 12px; color: #b6bcc8; background: #191b20; border: 1px solid #2a2d34;
    border-radius: 999px; padding: 5px 12px; cursor: pointer; transition: all 160ms var(--ease);
  }
  .states button:hover { color: #fff; border-color: #454a55; }
  .states button[aria-pressed="true"] { background: #e9eaee; color: #0e0f12; border-color: #e9eaee; }

  /* ---------- comparison grid ---------- */
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  @media (max-width: 1180px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .slot { display: grid; gap: 8px; }
  .slot .label { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #868c99; padding-left: 2px; }

  .card {
    position: relative; height: 100%; padding: 14px 15px 12px; border-radius: 20px;
    display: flex; flex-direction: column; gap: 6px;
    background: var(--card-bg); border: 1px solid var(--card-border); color: var(--ink);
    box-shadow: var(--card-shadow);
    backdrop-filter: blur(18px) saturate(120%);
    -webkit-backdrop-filter: blur(18px) saturate(120%);
    transition: transform 260ms var(--ease), box-shadow 260ms var(--ease), opacity 260ms var(--ease), filter 260ms var(--ease);
  }
  .card:hover { transform: translateY(-2px); }
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: repeating-linear-gradient(90deg, var(--flute) 0 1px, transparent 1px 7px);
    mix-blend-mode: soft-light; opacity: .45;
  }
  .top { display: flex; align-items: center; gap: 6px; }
  .kicker { font-size: 9.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: auto; }
  .stage { position: relative; height: 132px; display: grid; place-items: center; }
  .orb { width: 132px; height: 132px; display: block; }
  .halo {
    position: absolute; width: 104px; height: 104px; border-radius: 50%;
    background: radial-gradient(circle, var(--halo), transparent 70%); filter: blur(8px);
  }
  .ring { position: absolute; width: 104px; height: 104px; border-radius: 50%; border: 1px dashed var(--ring); opacity: 0; }
  .listening .ring { animation: ripple 3s var(--ease) infinite; }
  .listening .ring:nth-child(2) { animation-delay: 1.5s; }
  @keyframes ripple { from { transform: scale(1); opacity: .55; } to { transform: scale(1.5); opacity: 0; } }

  .check { position: absolute; width: 40px; height: 40px; opacity: 0; transform: scale(.75); transition: opacity 200ms var(--ease), transform 240ms var(--ease); }
  .check path { fill: none; stroke: var(--check); stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; }
  .done .check { opacity: 1; transform: scale(1); }
  .done .check path { animation: draw 400ms var(--ease) 120ms forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .title { margin: 0; font-size: 15px; font-weight: 620; letter-spacing: -.015em; line-height: 1.3; min-height: 20px; }
  .sub { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.45; min-height: 16px; }
  .strip { margin-top: 6px; height: 22px; }
  .strip canvas { width: 100%; height: 100%; display: block; }
  .card.leaving { transform: scale(.95); opacity: 0; filter: blur(1.5px); }

  /* ---------- palettes ---------- */
  /* 1 · warm paper (current) */
  [data-theme="paper"] {
    --bg: radial-gradient(120% 90% at 50% 0%, #f7f2e8, #efe7da 55%, #e6ddcd);
    --card-bg: linear-gradient(180deg, rgb(255 255 255 / .78), rgb(255 255 255 / .55));
    --card-border: rgb(255 255 255 / .85);
    --card-shadow: 0 1px 0 rgb(255 255 255 / .9) inset, 0 24px 50px -26px rgb(60 45 30 / .5);
    --flute: rgb(255 255 255 / .3);
    --ink: #14110d; --muted: #8a8175; --accent: #c2542c; --ring: rgb(194 84 44 / .32);
    --halo: rgb(194 84 44 / .18); --check: #fff8ef;
    --dot-lit: #d0774a; --dot-dim: #7c2f18; --spec: #fff3e6;
  }
  /* 2 · blue */
  [data-theme="blue"] {
    --bg: radial-gradient(120% 90% at 50% 0%, #f4f8fd, #e8f0f9 55%, #dbe7f5);
    --card-bg: linear-gradient(180deg, rgb(255 255 255 / .8), rgb(255 255 255 / .58));
    --card-border: rgb(255 255 255 / .9);
    --card-shadow: 0 1px 0 rgb(255 255 255 / .95) inset, 0 24px 50px -26px rgb(30 60 110 / .45);
    --flute: rgb(255 255 255 / .32);
    --ink: #0d1520; --muted: #6d7f93; --accent: #2f6fd0; --ring: rgb(47 111 208 / .3);
    --halo: rgb(47 111 208 / .2); --check: #f6fbff;
    --dot-lit: #4f86dd; --dot-dim: #163a72; --spec: #eef6ff;
  }
  /* 3 · blue violet */
  [data-theme="indigo"] {
    --bg: radial-gradient(120% 90% at 50% 0%, #f5f5fe, #eaecfb 55%, #dde1f7);
    --card-bg: linear-gradient(180deg, rgb(255 255 255 / .8), rgb(255 255 255 / .56));
    --card-border: rgb(255 255 255 / .9);
    --card-shadow: 0 1px 0 rgb(255 255 255 / .95) inset, 0 24px 50px -26px rgb(45 55 130 / .45);
    --flute: rgb(255 255 255 / .32);
    --ink: #101326; --muted: #717699; --accent: #5563d8; --ring: rgb(85 99 216 / .3);
    --halo: rgb(85 99 216 / .2); --check: #f7f8ff;
    --dot-lit: #6a75e0; --dot-dim: #262b78; --spec: #eef0ff;
  }
  /* 4 · violet */
  [data-theme="violet"] {
    --bg: radial-gradient(120% 90% at 50% 0%, #f8f4fe, #f0eafb 55%, #e5dcf7);
    --card-bg: linear-gradient(180deg, rgb(255 255 255 / .8), rgb(255 255 255 / .56));
    --card-border: rgb(255 255 255 / .9);
    --card-shadow: 0 1px 0 rgb(255 255 255 / .95) inset, 0 24px 50px -26px rgb(80 40 140 / .42);
    --flute: rgb(255 255 255 / .32);
    --ink: #180f26; --muted: #83739c; --accent: #7a4bd0; --ring: rgb(122 75 208 / .3);
    --halo: rgb(122 75 208 / .2); --check: #fcfaff;
    --dot-lit: #8f5fe0; --dot-dim: #431f7c; --spec: #f6efff;
  }
  /* 5 · graphite */
  [data-theme="graphite"] {
    --bg: radial-gradient(120% 90% at 50% 0%, #26282e, #1a1b20 55%, #121317);
    --card-bg: linear-gradient(180deg, rgb(255 255 255 / .09), rgb(255 255 255 / .04));
    --card-border: rgb(255 255 255 / .14);
    --card-shadow: 0 1px 0 rgb(255 255 255 / .16) inset, 0 24px 50px -22px rgb(0 0 0 / .7);
    --flute: rgb(255 255 255 / .12);
    --ink: #f2f3f6; --muted: #9aa1ad; --accent: #b9c0cc; --ring: rgb(200 208 220 / .26);
    --halo: rgb(180 190 205 / .18); --check: #12131a;
    --dot-lit: #f2f5fa; --dot-dim: #79818f; --spec: #ffffff;
  }

  /* Each slot paints its own backdrop so the five palettes can sit side by side. */
  .slot { border-radius: 26px; padding: 10px; background: var(--bg); }

  .replay {
    justify-self: center; font: inherit; font-size: 12px; padding: 7px 16px; border-radius: 999px;
    border: 1px solid #2a2d34; background: #191b20; color: #b6bcc8; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 240ms var(--ease);
  }
  .replay.show { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) {
    .ring, .card.leaving { animation: none; }
    .card, .replay { transition: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <h1>语音面板 · 配色横向对比</h1>
  <span class="hint">同一套结构、同一个点阵球，只换颜色语言 · 键盘 1–4 或点按钮切换状态</span>
  <span class="spacer"></span>
  <div class="states" role="group" aria-label="状态">
    <button type="button" data-state="listening" aria-pressed="true">收听</button>
    <button type="button" data-state="thinking" aria-pressed="false">思考</button>
    <button type="button" data-state="processing" aria-pressed="false">处理</button>
    <button type="button" data-state="done" aria-pressed="false">完成</button>
  </div>
</div>

<section class="grid" id="grid"></section>
<button class="replay" id="replay" type="button">重新演示</button>

<script>
  const THEMES = [
    { key: 'paper', label: 'Paper · 暖纸', kicker: 'WORKFILES', title: '我在听' },
    { key: 'blue', label: 'Blue · 蓝', kicker: 'WORKFILES', title: '我在听' },
    { key: 'indigo', label: 'Indigo · 蓝紫', kicker: 'WORKFILES', title: '我在听' },
    { key: 'violet', label: 'Violet · 紫', kicker: 'WORKFILES', title: '我在听' },
    { key: 'graphite', label: 'Graphite · 石墨黑', kicker: 'WORKFILES', title: '我在听' },
  ];

  const COPY = {
    listening: ['我在听', '收听中 · 停顿约 1 秒自动提交'],
    thinking: ['在想你要哪一份', '思考中 · 正在比对最近 7 天的线索'],
    processing: ['正在打开', '处理中 · 正在请求系统打开第一条'],
    done: ['好了', '已完成 · 窗口即将收起'],
  };

  const BAYER = [
    0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26,
    12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
    3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
    15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21,
  ].map(value => (value + 0.5) / 64);

  /* Build five identical cards. */
  const grid = document.getElementById('grid');
  const cards = [];
  for (const theme of THEMES) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.theme = theme.key;
    slot.innerHTML = `
      <div class="label">${theme.label}</div>
      <article class="card listening">
        <div class="top">
          <span class="kicker">${theme.kicker}</span>
          <span class="dot" aria-hidden="true"></span>
        </div>
        <div class="stage">
          <span class="halo" aria-hidden="true"></span>
          <span class="ring" aria-hidden="true"></span>
          <span class="ring" aria-hidden="true"></span>
          <canvas class="orb" aria-hidden="true"></canvas>
          <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.6 4.6L19 7.6"></path></svg>
        </div>
        <h2 class="title">我在听</h2>
        <p class="sub">收听中 · 停顿约 1 秒自动提交</p>
        <div class="strip"><canvas aria-hidden="true"></canvas></div>
      </article>`;
    grid.appendChild(slot);
    const card = slot.querySelector('.card');
    cards.push({
      slot, card,
      title: slot.querySelector('.title'),
      sub: slot.querySelector('.sub'),
      orbCanvas: slot.querySelector('.orb'),
      stripCanvas: slot.querySelector('.strip canvas'),
      orb: { ctx: null, size: 0, spacing: 6, radius: 0 },
      strip: { ctx: null, img: null, cols: 0, rows: 0, cell: 2, buffer: document.createElement('canvas') },
    });
  }

  const palette = key => {
    const slot = document.querySelector(`.slot[data-theme="${key}"]`);
    const style = getComputedStyle(slot);
    return {
      lit: style.getPropertyValue('--dot-lit').trim(),
      dim: style.getPropertyValue('--dot-dim').trim(),
      spec: style.getPropertyValue('--spec').trim(),
      accent: style.getPropertyValue('--accent').trim(),
    };
  };
  const PAL = Object.fromEntries(THEMES.map(theme => [theme.key, palette(theme.key)]));

  const parseRGB = value => {
    const hex = value.replace('#', '');
    const n = parseInt(hex.length === 3 ? hex.split('').map(c => c + c).join('') : hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const mix = (a, b, t) => {
    const [r1, g1, b1] = parseRGB(a), [r2, g2, b2] = parseRGB(b);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)} ${Math.round(g1 + (g2 - g1) * t)} ${Math.round(b1 + (b2 - b1) * t)})`;
  };

  let state = 'listening';
  let started = performance.now();
  let level = 0.4;

  function setState(next) {
    state = next;
    started = performance.now();
    for (const entry of cards) {
      entry.card.className = `card ${next}`;
      entry.title.textContent = COPY[next][0];
      entry.sub.textContent = COPY[next][1];
    }
    for (const button of document.querySelectorAll('.states button')) {
      button.setAttribute('aria-pressed', String(button.dataset.state === next));
    }
    if (next === 'done') {
      setTimeout(() => { for (const entry of cards) entry.card.classList.add('leaving'); }, 1200);
      setTimeout(() => document.getElementById('replay').classList.add('show'), 1600);
    } else {
      for (const entry of cards) entry.card.classList.remove('leaving');
      document.getElementById('replay').classList.remove('show');
    }
  }

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    for (const entry of cards) {
      const css = entry.orbCanvas.clientWidth || 132;
      entry.orbCanvas.width = Math.round(css * ratio);
      entry.orbCanvas.height = Math.round(css * ratio);
      entry.orb.ctx = entry.orbCanvas.getContext('2d');
      entry.orb.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      entry.orb.size = css; entry.orb.spacing = Math.max(4.5, css / 26); entry.orb.radius = css * 0.43;

      const width = Math.max(60, Math.floor(entry.stripCanvas.clientWidth * ratio));
      const height = Math.max(16, Math.floor(entry.stripCanvas.clientHeight * ratio));
      entry.stripCanvas.width = width; entry.stripCanvas.height = height;
      entry.strip.cell = Math.max(2, Math.round(2 * ratio));
      entry.strip.cols = Math.ceil(width / entry.strip.cell);
      entry.strip.rows = Math.ceil(height / entry.strip.cell);
      entry.strip.ctx = entry.stripCanvas.getContext('2d');
      entry.strip.buffer.width = entry.strip.cols; entry.strip.buffer.height = entry.strip.rows;
      entry.strip.bufferCtx = entry.strip.buffer.getContext('2d');
      entry.strip.img = entry.strip.bufferCtx.createImageData(entry.strip.cols, entry.strip.rows);
    }
  }

  function drawOrb(entry, key, now) {
    const { ctx, size, radius, spacing } = entry.orb;
    const pal = PAL[key];
    const time = (now - started) / 1000;
    const center = size / 2;
    ctx.clearRect(0, 0, size, size);
    const lx = -0.42, ly = -0.5, lz = 0.76;
    const sweepX = state === 'processing' ? -radius + ((time * 0.95) % 1) * radius * 2 : 0;

    for (let y = -radius; y <= radius; y += spacing) {
      for (let x = -radius; x <= radius; x += spacing) {
        const distance = Math.hypot(x, y);
        if (distance > radius) continue;
        const z = Math.sqrt(Math.max(0, radius * radius - x * x - y * y)) / radius;
        const nx = x / radius, ny = y / radius;
        const lambert = Math.max(0, nx * lx + ny * ly + z * lz);
        const light = Math.pow(lambert, 1.45);

        let wave;
        if (state === 'listening') wave = Math.sin(distance * 0.24 - time * 2.6) * (0.55 + 0.45 * level);
        else if (state === 'thinking') wave = Math.sin(Math.atan2(y, x) * 3 + distance * 0.09 - time * 2.2);
        else if (state === 'processing') wave = Math.sin(distance * 0.3 - time * 4.2) * 0.7;
        else wave = Math.sin(distance * 0.16 - time * 1.1) * 0.35;

        let band = 0;
        if (state === 'processing') {
          const delta = (x - sweepX) / (radius * 0.32);
          band = Math.exp(-delta * delta);
        }

        const edge = Math.min(1, (radius - distance) / (spacing * 0.4));
        const sphere = 0.32 + 0.68 * z;
        const energy = 0.28 + 0.52 * light + 0.14 * wave + 0.30 * band;
        const dotRadius = spacing * 0.40 * sphere * (0.42 + 0.85 * light + 0.2 * wave + 0.3 * band) * edge;
        if (dotRadius <= 0.18) continue;

        // Lit side keeps its hue, shadow side deepens: dots stay visible on light cards.
        const shade = Math.min(1, Math.max(0, 1 - light * 0.95 - band * 0.35));
        ctx.beginPath();
        ctx.fillStyle = mix(pal.lit, pal.dim, shade);
        ctx.globalAlpha = Math.min(1, 0.30 + 0.70 * Math.min(1, energy));
        ctx.arc(center + x, center + y, dotRadius, 0, Math.PI * 2);
        ctx.fill();
        if (light > 0.86 && band < 0.2) {
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = pal.spec;
          ctx.beginPath();
          ctx.arc(center + x, center + y, dotRadius * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawStrip(entry, key, now) {
    const s = entry.strip, pal = PAL[key];
    const time = (now - started) / 1000;
    const progress = state === 'processing' ? Math.min(1, time / 6) : 1;
    const data = s.img.data;
    let index = 0;
    const mid = (s.rows - 1) / 2;
    const [r, g, b] = parseRGB(pal.accent);
    for (let y = 0; y < s.rows; y++) {
      for (let x = 0; x < s.cols; x++) {
        const nx = x / s.cols;
        const shape = Math.max(0, 1 - Math.abs(nx - 0.5) * 2 * 1.15);
        let amplitude;
        if (state === 'listening') amplitude = shape * (0.3 + 0.7 * level) * (0.55 + 0.45 * Math.sin(time * 3.4 + nx * 24));
        else if (state === 'thinking') amplitude = shape * 0.2 * (0.5 + 0.5 * Math.sin(time * 1.4 + nx * 8));
        else if (state === 'processing') amplitude = nx < progress ? 0.4 + 0.1 * shape : 0.05;
        else amplitude = shape * 0.12;
        const distance = Math.abs(y - mid) / Math.max(1, mid);
        const edge = (BAYER[(y % 8) * 8 + (x % 8)] - 0.5) * 0.08;
        const on = distance < amplitude + edge;
        data[index++] = r; data[index++] = g; data[index++] = b;
        data[index++] = on ? 220 : 0;
      }
    }
    s.bufferCtx.putImageData(s.img, 0, 0);
    s.ctx.clearRect(0, 0, entry.stripCanvas.width, entry.stripCanvas.height);
    s.ctx.imageSmoothingEnabled = false;
    s.ctx.drawImage(s.buffer, 0, 0, s.cols, s.rows, 0, 0, s.cols * s.cell, s.rows * s.cell);
  }

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(now) {
    level = 0.3 + 0.28 * (0.5 + 0.5 * Math.sin((now - started) / 420)) + 0.16 * (0.5 + 0.5 * Math.sin((now - started) / 190 + 1.3));
    for (let i = 0; i < cards.length; i++) {
      const entry = cards[i], key = THEMES[i].key;
      drawOrb(entry, key, now);
      drawStrip(entry, key, now);
    }
    requestAnimationFrame(tick);
  }

  addEventListener('resize', resize);
  for (const button of document.querySelectorAll('.states button')) {
    button.addEventListener('click', () => setState(button.dataset.state));
  }
  addEventListener('keydown', event => {
    const map = { '1': 'listening', '2': 'thinking', '3': 'processing', '4': 'done' };
    if (map[event.key]) setState(map[event.key]);
    if (event.key === 'Escape') setState('done');
    if (event.key.toLowerCase() === 'r') setState('listening');
  });
  document.getElementById('replay').addEventListener('click', () => setState('listening'));

  resize(); setState('listening');
  if (!reduced) requestAnimationFrame(tick);
  else { const now = performance.now(); cards.forEach((entry, i) => { drawOrb(entry, THEMES[i].key, now); drawStrip(entry, THEMES[i].key, now); }); }
</script>
</body>
</html>
