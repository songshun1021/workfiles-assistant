<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Orb · 语音面板概念 C</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f4f6fb;
    --muted: #939aab;
    --accent: #7ee0c3;
    --accent-2: #8fb4ff;
    --ease: cubic-bezier(.22,.61,.36,1);
    font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background:
      radial-gradient(1200px 700px at 50% -10%, #17203a 0%, #0a0d16 55%, #05070b 100%);
  }

  .stage { display: grid; place-items: center; gap: 26px; text-align: center; }

  /* The orb: an original squircle body with a soft inner light. */
  .orb {
    position: relative; width: 168px; height: 168px;
    border-radius: 46% 54% 52% 48% / 52% 46% 54% 48%;
    background:
      radial-gradient(120% 120% at 32% 22%, rgb(255 255 255 / .9), rgb(255 255 255 / .06) 46%, transparent 70%),
      linear-gradient(160deg, var(--accent) 0%, #4fb8a8 42%, var(--accent-2) 100%);
    box-shadow:
      inset 0 -18px 40px rgb(0 0 0 / .22),
      0 30px 70px rgb(0 0 0 / .45),
      0 0 0 1px rgb(255 255 255 / .12);
    animation: breathe 3.6s var(--ease) infinite;
    transition: border-radius 420ms var(--ease), transform 320ms var(--ease), filter 320ms var(--ease);
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.035); }
  }

  /* Face */
  .eyes { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 26px; }
  .eye {
    width: 13px; height: 20px; border-radius: 50%; background: #0d1420;
    animation: blinkEye 5.2s var(--ease) infinite;
    transition: height 220ms var(--ease), width 220ms var(--ease), transform 260ms var(--ease);
  }
  @keyframes blinkEye { 0%, 94%, 100% { transform: scaleY(1); } 96%, 98% { transform: scaleY(.12); } }
  .mouth {
    position: absolute; left: 50%; top: 58%; width: 24px; height: 10px; margin-left: -12px;
    border: 2.4px solid #0d1420; border-top: 0; border-radius: 0 0 16px 16px;
    transition: all 260ms var(--ease);
  }

  /* Halo rings that only appear while listening. */
  .halo { position: absolute; inset: -26px; border-radius: 50%; border: 1px solid rgb(126 224 195 / .35); opacity: 0; }
  .listening .halo { animation: halo 2.6s var(--ease) infinite; }
  .listening .halo:nth-child(2) { animation-delay: 1.3s; }
  @keyframes halo { from { transform: scale(.7); opacity: .7; } to { transform: scale(1.25); opacity: 0; } }

  /* Thinking: eyes look around, body tilts slightly, dotted ring spins. */
  .thinking .orb { animation: think 1.9s var(--ease) infinite; }
  .thinking .eye { height: 15px; width: 15px; }
  .thinking .eye:nth-child(1) { transform: translateX(3px); }
  .thinking .eye:nth-child(2) { transform: translateX(5px); }
  .thinking .mouth { width: 16px; height: 4px; margin-left: -8px; border-radius: 0 0 8px 8px; }
  @keyframes think {
    0%, 100% { transform: rotate(-2deg) scale(1); }
    50% { transform: rotate(2deg) scale(.985); }
  }

  /* Processing: compress into a tighter, brighter pulse. */
  .processing .orb { animation: squeeze 1.1s var(--ease) infinite; filter: saturate(1.2) brightness(1.06); }
  .processing .eye { height: 8px; width: 18px; border-radius: 40%; }
  .processing .mouth { width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border-width: 3px; }
  @keyframes squeeze {
    0%, 100% { transform: scale(.97); border-radius: 46% 54% 52% 48% / 52% 46% 54% 48%; }
    50% { transform: scale(1.02); border-radius: 52% 48% 46% 54% / 48% 54% 46% 52%; }
  }

  /* Done: eyes become a happy arc, body settles and fades slightly. */
  .done .orb { animation: settle 520ms var(--ease); transform: none; }
  .done .eye { height: 10px; width: 20px; border-radius: 12px 12px 4px 4px; transform: translateY(-2px); }
  .done .mouth { width: 30px; height: 14px; margin-left: -15px; }
  @keyframes settle {
    0% { transform: scale(1.06); }
    60% { transform: scale(.97); }
    100% { transform: scale(1); }
  }

  .copy { display: grid; gap: 6px; }
  .title { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.015em; color: var(--ink); }
  .body { margin: 0; font-size: 13px; color: var(--muted); }

  .states { display: flex; gap: 6px; }
  .states button {
    font: inherit; font-size: 12px; color: var(--muted); background: rgb(255 255 255 / .04);
    border: 1px solid rgb(255 255 255 / .12); border-radius: 999px; padding: 5px 12px; cursor: pointer;
    transition: all 160ms var(--ease);
  }
  .states button:hover { color: var(--ink); border-color: rgb(255 255 255 / .3); }
  .states button[aria-pressed="true"] { color: #06110f; background: var(--accent); border-color: var(--accent); }
  .note { font-size: 11px; color: var(--muted); opacity: .8; max-width: 34ch; }

  @media (prefers-reduced-motion: reduce) {
    .orb, .eye, .halo, .thinking .orb, .processing .orb, .done .orb { animation: none !important; }
    .orb, .eye, .mouth { transition: none; }
  }
</style>
</head>
<body>
<main class="stage listening" id="stage" aria-label="语音助手面板概念 C：情绪球">
  <div class="orb" aria-hidden="true">
    <span class="halo"></span><span class="halo"></span>
    <span class="eyes"><span class="eye"></span><span class="eye"></span></span>
    <span class="mouth"></span>
  </div>

  <div class="copy">
    <h1 class="title" id="title">我在听</h1>
    <p class="body" id="body">说完停顿一下，我就开始找</p>
  </div>

  <div class="states" role="group" aria-label="状态演示">
    <button type="button" data-state="listening" aria-pressed="true">收听</button>
    <button type="button" data-state="thinking" aria-pressed="false">思考</button>
    <button type="button" data-state="processing" aria-pressed="false">处理</button>
    <button type="button" data-state="done" aria-pressed="false">完成</button>
  </div>

  <p class="note">概念 C · 情绪球（原创几何，未使用 Emotion Ball 的美术素材）</p>
</main>

<script>
  const stage = document.getElementById('stage');
  const title = document.getElementById('title');
  const body = document.getElementById('body');
  const buttons = [...document.querySelectorAll('.states button')];

  const copy = {
    listening: ['我在听', '说完停顿一下，我就开始找'],
    thinking: ['在想你要哪一份', '正在比对最近 7 天的线索'],
    processing: ['正在打开', '已定位候选，正在请求系统打开'],
    done: ['好了', '系统已接受请求，窗口气泡即将收起'],
  };

  function setState(next) {
    stage.className = `stage ${next}`;
    title.textContent = copy[next][0];
    body.textContent = copy[next][1];
    for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.state === next));
  }

  for (const button of buttons) button.addEventListener('click', () => setState(button.dataset.state));
  addEventListener('keydown', event => {
    const map = { '1': 'listening', '2': 'thinking', '3': 'processing', '4': 'done' };
    if (map[event.key]) setState(map[event.key]);
  });
</script>
</body>
</html>
