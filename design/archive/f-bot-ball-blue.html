<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Ball · 白底蓝点缀 · 单一窗口</title>
<style>
  /* Palette follows DeepSeek Harness' own token philosophy: the ground and primary ink are
     monochrome; the brand blue is an ACCENT only (state, focus, action), never a big fill. */
  :root {
    color-scheme: light;
    --ground: #f6f7f9;
    --surface: #ffffff;
    --ink: #0f1115;
    --ink-soft: #3d434d;
    --muted: #767d89;
    --hair: rgb(15 17 21 / .09);
    --hair-strong: rgb(15 17 21 / .16);
    --blue: #4d6bfe;          /* DeepSeek Chat blue */
    --blue-deep: #4176e6;     /* DSH "business" blue */
    --blue-soft: #e8eefe;
    --ease: cubic-bezier(.22,.61,.36,1);
    font-family: "SF Pro Text", -apple-system, "PingFang SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--ground); }

  /* One surface: the window is the card. No separate backdrop. */
  .panel {
    position: relative; width: 432px; height: 252px; border-radius: 24px; overflow: hidden;
    background: var(--surface);
    box-shadow:
      0 0 0 1px var(--hair),
      0 18px 44px -20px rgb(15 17 21 / .28),
      0 2px 8px rgb(15 17 21 / .04);
    color: var(--ink);
    transition: transform 300ms var(--ease), opacity 300ms var(--ease), filter 300ms var(--ease);
  }
  #ribbons { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .content { position: relative; display: flex; flex-direction: column; height: 100%; padding: 14px 16px 10px; }

  .top { display: flex; align-items: center; gap: 8px; }
  .kicker { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .spacer { flex: 1; }
  .icon-btn {
    display: grid; place-items: center; width: 26px; height: 26px; padding: 0;
    border: 1px solid var(--hair); border-radius: 50%; background: transparent; color: var(--ink-soft);
    cursor: pointer; transition: all 150ms var(--ease);
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--hair-strong); background: var(--ground); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* ---------- the ball ---------- */
  .stage { position: relative; flex: 1; display: grid; place-items: center; }
  .ball {
    position: relative; width: 104px; height: 104px; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 28%, #33383f 0%, #1b1f26 34%, #0f1115 68%, #080a0d 100%);
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / .18),
      inset 0 -12px 22px rgb(0 0 0 / .55),
      0 16px 28px -14px rgb(15 17 21 / .5);
    animation: bob 3.2s var(--ease) infinite;
    transition: transform 300ms var(--ease), border-radius 420ms var(--ease), filter 300ms var(--ease);
  }
  /* specular */
  .ball::after {
    content: ""; position: absolute; left: 18%; top: 12%; width: 38%; height: 28%; border-radius: 50%;
    background: radial-gradient(circle, rgb(255 255 255 / .42), transparent 70%); filter: blur(2px);
  }
  @keyframes bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.02); } }

  .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 20px; }
  .eye {
    position: relative; width: 15px; height: 26px; border-radius: 999px; background: #f7f8fa;
    transition: all 300ms var(--ease);
  }
  /* listening: wide vertical eyes; thinking: shifted + one squints; processing: flat bars;
     done: happy arcs. Everything is the eye, exactly like the Grok grammar. */
  .listening .eye { height: 30px; width: 16px; }
  .thinking .eye { height: 24px; width: 14px; border-radius: 40% 60% 55% 45%; }
  .thinking .eye:nth-child(1) { transform: translate(3px, -4px) rotate(-8deg); }
  .thinking .eye:nth-child(2) { transform: translate(7px, -1px) scale(.82); }
  .processing .eye { height: 8px; width: 22px; border-radius: 4px; }
  .processing .eye:nth-child(1) { transform: translateY(-1px); }
  .processing .eye:nth-child(2) { transform: translateY(1px); }
  .done .eye {
    height: 14px; width: 24px; background: transparent; border-radius: 14px 14px 3px 3px;
    border-top: 5px solid #f7f8fa;
  }

  /* state motion on the ball itself */
  .thinking .ball { animation: think 2s var(--ease) infinite; border-radius: 46% 54% 52% 48%; }
  @keyframes think { 0%, 100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-2px); } }
  .processing .ball { animation: press 0.9s var(--ease) infinite; }
  @keyframes press { 0%, 100% { transform: scale(.98, .96); } 50% { transform: scale(1.02, 1); } }
  .done .ball { animation: hop 640ms var(--ease); }
  @keyframes hop { 0% { transform: translateY(0) scale(1); } 38% { transform: translateY(-12px) scale(1.05); } 100% { transform: translateY(0) scale(1); } }

  /* ripple: only while truly listening */
  .ring { position: absolute; width: 104px; height: 104px; border-radius: 50%; border: 1px solid rgb(77 107 254 / .35); opacity: 0; }
  .listening .ring { animation: ripple 2.8s var(--ease) infinite; }
  .listening .ring:nth-of-type(2) { animation-delay: .93s; }
  .listening .ring:nth-of-type(3) { animation-delay: 1.86s; }
  @keyframes ripple { from { transform: scale(1); opacity: .55; } to { transform: scale(1.75); opacity: 0; } }

  /* thinking: three dots orbiting the ball */
  .orbit { position: absolute; width: 148px; height: 148px; opacity: 0; transition: opacity 220ms var(--ease); }
  .orbit i { position: absolute; inset: 0; animation: spin 3.4s linear infinite; }
  .orbit i::before { content: ""; position: absolute; left: calc(50% - 3px); top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); opacity: .85; }
  .orbit i:nth-child(2) { animation-duration: 2.4s; animation-direction: reverse; }
  .orbit i:nth-child(3) { animation-duration: 4.6s; }
  .thinking .orbit { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* copy */
  .copy { display: grid; gap: 2px; }
  .title { margin: 0; font-size: 16.5px; font-weight: 620; letter-spacing: -.012em; }
  .subtitle { margin: 0; font-size: 11.5px; color: var(--ink-soft); }
  .subtitle b { color: var(--blue-deep); font-weight: 600; }
  .body { margin: 2px 0 0; font-size: 11px; color: var(--muted); }

  /* demo dots: concept affordance only */
  .demo { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .demo span { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .demo .dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--hair-strong); background: transparent; cursor: pointer; padding: 0; transition: all 150ms var(--ease); }
  .demo .dot[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); }

  .panel.leaving { transform: scale(.95); opacity: 0; filter: blur(2px); }

  @media (prefers-reduced-motion: reduce) {
    .ball, .ring, .orbit i, .done .ball { animation: none !important; }
    .panel, .ball, .eye { transition: none; }
  }
</style>
</head>
<body>
<main class="panel listening" id="panel" aria-label="语音助手：白底蓝点缀 · 球形机器人">
  <canvas id="ribbons" aria-hidden="true"></canvas>

  <div class="content">
    <div class="top">
      <span class="kicker">Workfiles</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="primary" aria-label="开始或停止" title="开始 / 停止">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <button class="icon-btn" id="cancel" aria-label="取消" title="取消（Esc）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg>
      </button>
    </div>

    <div class="stage">
      <span class="ring" aria-hidden="true"></span>
      <span class="ring" aria-hidden="true"></span>
      <span class="ring" aria-hidden="true"></span>
      <div class="orbit" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="ball" id="ball" aria-hidden="true">
        <div class="face"><span class="eye"></span><span class="eye"></span></div>
      </div>
    </div>

    <div class="copy">
      <h1 class="title" id="title">我在听</h1>
      <p class="subtitle" id="subtitle">收听中 · 停顿约 1 秒自动提交</p>
      <p class="body" id="body">试试说「打开我最近看过的三条推文」</p>
    </div>

    <div class="demo" role="group" aria-label="状态演示（仅概念稿）">
      <span>演示</span>
      <button class="dot" data-state="listening" aria-pressed="true" aria-label="收听"></button>
      <button class="dot" data-state="thinking" aria-pressed="false" aria-label="思考"></button>
      <button class="dot" data-state="processing" aria-pressed="false" aria-label="处理"></button>
      <button class="dot" data-state="done" aria-pressed="false" aria-label="完成"></button>
    </div>
  </div>
</main>

<script>
  const panel = document.getElementById('panel');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const body = document.getElementById('body');
  const dots = [...document.querySelectorAll('.demo .dot')];
  const canvas = document.getElementById('ribbons');
  const ctx = canvas.getContext('2d');

  const COPY = {
    listening: ['我在听', '收听中 · 停顿约 1 秒自动提交', '试试说「打开我最近看过的三条推文」'],
    thinking: ['在想你要哪一份', '思考中 · 正在比对最近 7 天的线索', '候选：三条推文，按观察时间排序'],
    processing: ['正在打开', '执行中 · 正在请求系统打开第一条', '系统接受请求后不代表窗口已经出现'],
    done: ['好了', '已完成 · 窗口即将收起', '已请求打开 · 你可以继续做别的事'],
  };

  let state = 'listening';
  let spawnRate = 0;

  function setState(next) {
    state = next;
    panel.className = `panel ${next}`;
    title.textContent = COPY[next][0];
    subtitle.textContent = COPY[next][1];
    body.textContent = COPY[next][2];
    for (const dot of dots) dot.setAttribute('aria-pressed', String(dot.dataset.state === next));
    panel.classList.remove('leaving');
    if (next === 'processing') spawnRate = 0.5;      // ribbons keep drifting while executing
    else if (next === 'done') { burst(); setState.doneAt = performance.now(); }
    else spawnRate = 0;
    if (next === 'done') setTimeout(() => panel.classList.add('leaving'), 1700);
  }

  /* ---------- ribbon particles (the "彩带" the executing state deserves) ---------- */
  const ribbons = [];
  const PALETTE = ['#4d6bfe', '#4176e6', '#8aa2ff', '#b7c8fe', '#0f1115'];

  function size() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(panel.clientWidth * ratio);
    canvas.height = Math.floor(panel.clientHeight * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  function spawn(count, spreading) {
    const w = panel.clientWidth, h = panel.clientHeight;
    for (let i = 0; i < count; i++) {
      ribbons.push({
        x: w / 2 + (Math.random() - 0.5) * 60,
        y: h * 0.42 + (Math.random() - 0.5) * 28,
        vx: (Math.random() - 0.5) * (spreading ? 2.4 : 0.8),
        vy: spreading ? -1.6 - Math.random() * 2.2 : -0.4 - Math.random() * 0.7,
        w: 5 + Math.random() * 9,
        h: 2 + Math.random() * 2.4,
        rot: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 0.22,
        life: 0,
        ttl: spreading ? 1500 + Math.random() * 900 : 2600 + Math.random() * 1600,
        color: PALETTE[(Math.random() * PALETTE.length) | 0],
        sway: Math.random() * Math.PI * 2,
      });
    }
  }
  const burst = () => spawn(26, true);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(48, now - last); last = now;
    const w = panel.clientWidth, h = panel.clientHeight;
    ctx.clearRect(0, 0, w, h);
    if (spawnRate && Math.random() < spawnRate * (dt / 16)) spawn(1, false);

    for (let i = ribbons.length - 1; i >= 0; i--) {
      const r = ribbons[i];
      r.life += dt;
      if (r.life > r.ttl) { ribbons.splice(i, 1); continue; }
      r.vy += 0.012 * (dt / 16);          // gravity
      r.sway += 0.06 * (dt / 16);
      r.x += (r.vx + Math.sin(r.sway) * 0.35) * (dt / 16);
      r.y += r.vy * (dt / 16);
      r.rot += r.spin * (dt / 16);
      const fade = Math.max(0, 1 - r.life / r.ttl);
      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.rot);
      ctx.globalAlpha = fade * 0.9;
      ctx.fillStyle = r.color;
      ctx.fillRect(-r.w / 2, -r.h / 2, r.w, r.h * (0.4 + Math.abs(Math.sin(r.rot)) * 0.9));
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  for (const dot of dots) dot.addEventListener('click', () => setState(dot.dataset.state));
  document.getElementById('ball').addEventListener('click', () => {
    const order = ['listening', 'thinking', 'processing', 'done'];
    setState(order[(order.indexOf(state) + 1) % order.length]);
  });
  addEventListener('keydown', event => {
    const map = { '1': 'listening', '2': 'thinking', '3': 'processing', '4': 'done' };
    if (map[event.key]) setState(map[event.key]);
    if (event.key === 'Escape') setState('done');
    if (event.key.toLowerCase() === 'r') setState('listening');
  });
  document.getElementById('cancel').addEventListener('click', () => setState('done'));
  document.getElementById('primary').addEventListener('click', () => setState(state === 'listening' ? 'thinking' : 'listening'));
  addEventListener('resize', size);

  size();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frame);
  setState('listening');
</script>
</body>
</html>
