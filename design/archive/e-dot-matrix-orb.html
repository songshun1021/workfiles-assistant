<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper · Dot Orb · Glass — 语音面板</title>
<style>
  /* Only the floating panel is the product: warm paper ink, fluted glass, and a
     dot-matrix orb whose ripples carry the four states. No page-wide texture. */
  :root {
    color-scheme: light;
    --paper: #f3eee4;
    --paper-2: #e9e2d5;
    --ink: #14110d;
    --ink-soft: #4a443c;
    --muted: #8a8175;
    --hair: rgb(20 17 13 / .12);
    --accent: #c2542c;
    --moss: #35594b;
    --ease: cubic-bezier(.22,.61,.36,1);
    font-family: "SF Pro Text", -apple-system, "PingFang SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    /* Stand-in for the desktop behind the real floating window. */
    background: radial-gradient(120% 90% at 50% 0%, #f7f2e8 0%, var(--paper) 46%, var(--paper-2) 100%);
    color: var(--ink);
    overflow: hidden;
  }

  .card {
    position: relative;
    width: min(500px, 92vw);
    padding: 20px 22px 16px;
    border-radius: 26px;
    background: linear-gradient(180deg, rgb(255 255 255 / .74), rgb(255 255 255 / .52));
    border: 1px solid rgb(255 255 255 / .82);
    box-shadow:
      0 1px 0 rgb(255 255 255 / .9) inset,
      0 30px 60px -28px rgb(60 45 30 / .45),
      0 2px 8px rgb(60 45 30 / .06);
    backdrop-filter: blur(22px) saturate(120%);
    -webkit-backdrop-filter: blur(22px) saturate(120%);
    transition: transform 320ms var(--ease), opacity 320ms var(--ease), filter 320ms var(--ease);
  }
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgb(255 255 255 / .28) 0 1px, transparent 1px 7px);
    mix-blend-mode: soft-light; opacity: .5;
  }

  .top { display: flex; align-items: center; gap: 8px; }
  .kicker { font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
  .spacer { flex: 1; }
  .icon-btn {
    display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
    border: 1px solid var(--hair); border-radius: 50%; background: transparent; color: var(--ink-soft);
    cursor: pointer; transition: all 160ms var(--ease);
  }
  .icon-btn:hover { background: rgb(20 17 13 / .05); border-color: rgb(20 17 13 / .24); color: var(--ink); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* Dot-matrix orb: one canvas, fixed stage so copy never reflows. */
  .stage { position: relative; height: 196px; display: grid; place-items: center; margin: 2px 0 0; }
  .orb-canvas { width: 196px; height: 196px; display: block; }
  .halo {
    position: absolute; width: 152px; height: 152px; border-radius: 50%;
    background: radial-gradient(circle, rgb(194 84 44 / .16), transparent 68%);
    filter: blur(10px); pointer-events: none;
  }
  .ring {
    position: absolute; width: 150px; height: 150px; border-radius: 50%;
    border: 1px dashed rgb(194 84 44 / .3); opacity: 0;
  }
  .listening .ring { animation: ripple 3s var(--ease) infinite; }
  .listening .ring:nth-child(2) { animation-delay: 1.5s; }
  @keyframes ripple { from { transform: scale(1); opacity: .5; } to { transform: scale(1.55); opacity: 0; } }

  .check {
    position: absolute; width: 54px; height: 54px; opacity: 0; transform: scale(.7);
    transition: opacity 200ms var(--ease), transform 260ms var(--ease);
  }
  .check path {
    fill: none; stroke: #fff8ef; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 40; stroke-dashoffset: 40; filter: drop-shadow(0 2px 6px rgb(90 40 20 / .55));
  }
  .done .check { opacity: 1; transform: scale(1); }
  .done .check path { animation: draw 420ms var(--ease) 140ms forwards; }
  .done .ring { opacity: 0; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .title {
    margin: 0 0 4px; font-size: 20px; font-weight: 620; letter-spacing: -.018em; line-height: 1.28; min-height: 26px;
  }
  .subtitle { margin: 0; font-size: 12.5px; font-weight: 520; color: var(--ink-soft); letter-spacing: .01em; }
  .body { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); min-height: 18px; }

  /* The 1-bit signal strip stays: it is inside the window, not page decoration. */
  .strip { margin: 14px 0 0; height: 34px; position: relative; overflow: hidden; border-radius: 6px; }
  .strip canvas { width: 100%; height: 100%; display: block; }

  .foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .states { display: flex; gap: 5px; margin-left: auto; }
  .states button {
    font: inherit; font-size: 11.5px; color: var(--ink-soft); background: rgb(255 255 255 / .5);
    border: 1px solid var(--hair); border-radius: 999px; padding: 4px 11px; cursor: pointer;
    transition: all 160ms var(--ease);
  }
  .states button:hover { border-color: rgb(20 17 13 / .3); color: var(--ink); }
  .states button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .note { font-size: 10.5px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }

  .card.leaving { transform: scale(.94) translateY(6px); opacity: 0; filter: blur(2px); }
  .replay {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    font: inherit; font-size: 12px; padding: 7px 16px; border-radius: 999px;
    border: 1px solid rgb(20 17 13 / .18); background: rgb(255 255 255 / .7); color: var(--ink-soft);
    cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 240ms var(--ease);
  }
  .replay.show { opacity: 1; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    .ring, .card.leaving { animation: none; }
    .card, .replay { transition: none; }
  }
</style>
</head>
<body>

<main class="card listening" id="card" aria-label="语音助手面板：纸感点阵球">
  <div class="top">
    <span class="kicker">Workfiles · Voice</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="primary" title="开始 / 停止" aria-label="开始或停止说话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v16M4 12h12"></path></svg>
    </button>
    <button class="icon-btn" id="cancel" title="取消（Esc）" aria-label="取消">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg>
    </button>
  </div>

  <div class="stage">
    <span class="halo" aria-hidden="true"></span>
    <span class="ring" aria-hidden="true"></span>
    <span class="ring" aria-hidden="true"></span>
    <canvas class="orb-canvas" id="orb" aria-hidden="true"></canvas>
    <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.6 4.6L19 7.6"></path></svg>
  </div>

  <h1 class="title" id="title">我在听</h1>
  <p class="subtitle" id="subtitle">收听中 · 停顿约 1 秒自动提交</p>
  <p class="body" id="body">试试说「打开我最近看过的三条推文」</p>

  <div class="strip"><canvas id="signal" aria-hidden="true"></canvas></div>

  <div class="foot">
    <span class="note">Paper · Dot Orb · Glass</span>
    <div class="states" role="group" aria-label="状态演示">
      <button type="button" data-state="listening" aria-pressed="true">收听</button>
      <button type="button" data-state="thinking" aria-pressed="false">思考</button>
      <button type="button" data-state="processing" aria-pressed="false">处理</button>
      <button type="button" data-state="done" aria-pressed="false">完成</button>
    </div>
  </div>
</main>

<button class="replay" id="replay" type="button">重新演示</button>

<script>
  const card = document.getElementById('card');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const body = document.getElementById('body');
  const replay = document.getElementById('replay');
  const buttons = [...document.querySelectorAll('.states button')];
  const orbCanvas = document.getElementById('orb');
  const signalCanvas = document.getElementById('signal');

  const COPY = {
    listening: ['我在听', '收听中 · 停顿约 1 秒自动提交', '试试说「打开我最近看过的三条推文」'],
    thinking: ['在想你要哪一份', '思考中 · 正在比对最近 7 天的线索', '候选：三条推文，按观察时间排序'],
    processing: ['正在打开', '处理中 · 正在请求系统打开第一条', '系统接受请求后不代表窗口已经出现'],
    done: ['好了', '已完成 · 窗口即将收起', '已请求打开 · 你可以继续做别的事'],
  };

  const BAYER = [
    0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26,
    12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
    3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
    15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21,
  ].map(value => (value + 0.5) / 64);

  let state = 'listening';
  let started = performance.now();
  let level = 0.4;

  function setState(next, { silent = false } = {}) {
    state = next;
    started = performance.now();
    card.className = `card ${next}`;
    for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.state === next));
    title.textContent = COPY[next][0];
    subtitle.textContent = COPY[next][1];
    body.textContent = COPY[next][2];
    card.classList.remove('leaving');
    replay.classList.remove('show');
    if (next === 'done' && !silent) {
      setTimeout(() => card.classList.add('leaving'), 1200);
      setTimeout(() => replay.classList.add('show'), 1600);
    }
  }

  /* ---------- dot-matrix orb ---------- */
  const orb = { ctx: null, size: 0, spacing: 7, radius: 0 };
  function resizeOrb() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    const css = orbCanvas.clientWidth || 196;
    orbCanvas.width = Math.round(css * ratio);
    orbCanvas.height = Math.round(css * ratio);
    orb.ctx = orbCanvas.getContext('2d');
    orb.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    orb.size = css;
    orb.spacing = Math.max(5, css / 32);
    orb.radius = css * 0.43;
  }

  const lerp = (a, b, t) => a + (b - a) * t;
  function mixColor(t) {
    // peach → terracotta, kept in the same warm family as the paper ground.
    const r = Math.round(lerp(250, 194, t));
    const g = Math.round(lerp(228, 84, t));
    const b = Math.round(lerp(203, 44, t));
    return `rgb(${r} ${g} ${b})`;
  }

  function drawOrb(now) {
    const time = (now - started) / 1000;
    const ctx = orb.ctx, size = orb.size, radius = orb.radius;
    const center = size / 2;
    ctx.clearRect(0, 0, size, size);

    // Light direction for the fake sphere shading.
    const lx = -0.42, ly = -0.5, lz = 0.76;
    const sweepX = state === 'processing' ? -radius + ((time * 0.95) % 1) * radius * 2 : 0;

    for (let y = -radius; y <= radius; y += orb.spacing) {
      for (let x = -radius; x <= radius; x += orb.spacing) {
        const distance = Math.hypot(x, y);
        if (distance > radius) continue;
        const z = Math.sqrt(Math.max(0, radius * radius - x * x - y * y)) / radius;
        const nx = x / radius, ny = y / radius;
        const lambert = Math.max(0, nx * lx + ny * ly + z * lz);
        // Higher contrast shading so the matrix reads as a lit sphere, not a flat disc.
        const light = Math.pow(lambert, 1.45);

        // Ripple field: the state decides how the dot matrix moves.
        let wave;
        if (state === 'listening') {
          wave = Math.sin(distance * 0.22 - time * 2.6) * (0.55 + 0.45 * level);
        } else if (state === 'thinking') {
          const angle = Math.atan2(y, x);
          wave = Math.sin(angle * 3 + distance * 0.09 - time * 2.2);
        } else if (state === 'processing') {
          wave = Math.sin(distance * 0.3 - time * 4.2) * 0.7;
        } else {
          wave = Math.sin(distance * 0.16 - time * 1.1) * 0.35;
        }

        // Processing runs a highlight band across the sphere.
        let band = 0;
        if (state === 'processing') {
          const delta = (x - sweepX) / (radius * 0.32);
          band = Math.exp(-delta * delta);
        }

        const edge = Math.min(1, (radius - distance) / (orb.spacing * 0.4));
        const sphere = 0.32 + 0.68 * z;                 // silhouette curvature
        const energy = 0.28 + 0.52 * light + 0.14 * wave + 0.30 * band;
        const dotRadius = orb.spacing * 0.34 * sphere * (0.42 + 0.85 * light + 0.20 * wave + 0.30 * band) * edge;
        if (dotRadius <= 0.18) continue;

        const warmth = Math.min(1, Math.max(0, 1 - light * 1.15 - band * 0.45));
        ctx.beginPath();
        ctx.fillStyle = mixColor(warmth);
        ctx.globalAlpha = Math.min(1, 0.18 + 0.82 * Math.min(1, energy));
        ctx.arc(center + x, center + y, dotRadius, 0, Math.PI * 2);
        ctx.fill();
        // A tiny specular cluster where the light lands.
        if (light > 0.86 && band < 0.2) {
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = "rgb(255 249 240)";
          ctx.beginPath();
          ctx.arc(center + x, center + y, dotRadius * 0.42, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;

    // A quiet inner shadow at the bottom keeps the sphere from looking like a disc.
    const shade = ctx.createRadialGradient(center, center + radius * 0.45, radius * 0.2, center, center, radius);
    shade.addColorStop(0, 'rgb(120 45 25 / .16)');
    shade.addColorStop(1, 'rgb(120 45 25 / 0)');
    ctx.fillStyle = shade;
    ctx.beginPath();
    ctx.arc(center, center, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---------- 1-bit signal strip inside the window ---------- */
  const signal = { ctx: null, img: null, cols: 0, rows: 0, cell: 2, buffer: document.createElement('canvas') };
  function resizeSignal() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(80, Math.floor(signalCanvas.clientWidth * ratio));
    const height = Math.max(20, Math.floor(signalCanvas.clientHeight * ratio));
    signalCanvas.width = width; signalCanvas.height = height;
    signal.cell = Math.max(2, Math.round(2 * ratio));
    signal.cols = Math.ceil(width / signal.cell); signal.rows = Math.ceil(height / signal.cell);
    signal.ctx = signalCanvas.getContext('2d');
    signal.buffer.width = signal.cols; signal.buffer.height = signal.rows;
    signal.bufferCtx = signal.buffer.getContext('2d');
    signal.img = signal.bufferCtx.createImageData(signal.cols, signal.rows);
  }

  function drawSignal(now) {
    const time = (now - started) / 1000;
    const progress = state === 'processing' ? Math.min(1, time / 6) : 1;
    const data = signal.img.data;
    let index = 0;
    const mid = (signal.rows - 1) / 2;
    for (let y = 0; y < signal.rows; y++) {
      for (let x = 0; x < signal.cols; x++) {
        const nx = x / signal.cols;
        const centre = Math.abs(nx - 0.5) * 2;
        const shape = Math.max(0, 1 - centre * 1.15);
        let amplitude;
        if (state === 'listening') amplitude = shape * (0.30 + 0.70 * level) * (0.55 + 0.45 * Math.sin(time * 3.4 + nx * 26));
        else if (state === 'thinking') amplitude = shape * 0.22 * (0.5 + 0.5 * Math.sin(time * 1.4 + nx * 9));
        else if (state === 'processing') amplitude = nx < progress ? 0.40 + 0.10 * shape : 0.05;
        else amplitude = shape * 0.12;
        const distance = Math.abs(y - mid) / Math.max(1, mid);
        const edge = (BAYER[(y % 8) * 8 + (x % 8)] - 0.5) * 0.08;
        const on = distance < amplitude + edge;
        data[index++] = 194; data[index++] = 84; data[index++] = 44;
        data[index++] = on ? 235 : 0;
      }
    }
    signal.bufferCtx.putImageData(signal.img, 0, 0);
    signal.ctx.clearRect(0, 0, signalCanvas.width, signalCanvas.height);
    signal.ctx.imageSmoothingEnabled = false;
    signal.ctx.drawImage(signal.buffer, 0, 0, signal.cols, signal.rows, 0, 0, signal.cols * signal.cell, signal.rows * signal.cell);
  }

  /* ---------- loop ---------- */
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(now) {
    level = 0.3 + 0.28 * (0.5 + 0.5 * Math.sin((now - started) / 420)) + 0.16 * (0.5 + 0.5 * Math.sin((now - started) / 190 + 1.3));
    drawOrb(now);
    drawSignal(now);
    requestAnimationFrame(tick);
  }

  addEventListener('resize', () => { resizeOrb(); resizeSignal(); });
  for (const button of buttons) button.addEventListener('click', () => setState(button.dataset.state));
  addEventListener('keydown', event => {
    const map = { '1': 'listening', '2': 'thinking', '3': 'processing', '4': 'done' };
    if (map[event.key]) setState(map[event.key]);
    if (event.key === 'Escape') setState('done');
    if (event.key.toLowerCase() === 'r') setState('listening');
  });
  document.getElementById('primary').addEventListener('click', () => setState(state === 'listening' ? 'thinking' : 'listening'));
  document.getElementById('cancel').addEventListener('click', () => setState('done'));
  replay.addEventListener('click', () => setState('listening'));

  resizeOrb(); resizeSignal(); setState('listening');
  if (!reduced) requestAnimationFrame(tick);
  else { drawOrb(performance.now()); drawSignal(performance.now()); }
</script>
</body>
</html>
