<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Sphere · 抖动点阵球（单体窗口）</title>
<style>
  :root {
    color-scheme: light;
    --ground: #f6f7f9;
    --surface: #ffffff;
    --ink: #0f1115;
    --ink-soft: #3d434d;
    --muted: #767d89;
    --hair: rgb(15 17 21 / .09);
    --hair-strong: rgb(15 17 21 / .16);
    --blue: #4d6bfe;
    --blue-deep: #4176e6;
    --ease: cubic-bezier(.22,.61,.36,1);
    font-family: "SF Pro Text", -apple-system, "PingFang SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--ground); }

  /* One window = one surface. The ball lives inside it, nothing floats behind. */
  .panel {
    position: relative; width: 432px; height: 286px; border-radius: 24px; overflow: hidden;
    background: var(--surface); color: var(--ink);
    box-shadow: 0 0 0 1px var(--hair), 0 18px 44px -20px rgb(15 17 21 / .28), 0 2px 8px rgb(15 17 21 / .04);
    transition: transform 300ms var(--ease), opacity 300ms var(--ease), filter 300ms var(--ease);
  }
  .content { display: flex; flex-direction: column; height: 100%; padding: 14px 16px 10px; }

  .top { display: flex; align-items: center; gap: 8px; }
  .kicker { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .spacer { flex: 1; }
  .icon-btn {
    display: grid; place-items: center; width: 26px; height: 26px; padding: 0;
    border: 1px solid var(--hair); border-radius: 50%; background: transparent; color: var(--ink-soft);
    cursor: pointer; transition: all 150ms var(--ease);
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--hair-strong); background: var(--ground); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 14px; height: 14px; }

  .stage { position: relative; flex: 1; display: grid; place-items: center; }
  #sphere { display: block; width: 196px; height: 196px; }
  .halo {
    position: absolute; width: 196px; height: 196px; border-radius: 50%;
    box-shadow: 0 26px 40px -26px rgb(15 17 21 / .45);
    pointer-events: none;
  }

  .copy { display: grid; gap: 2px; }
  .title { margin: 0; font-size: 16.5px; font-weight: 620; letter-spacing: -.012em; }
  .subtitle { margin: 0; font-size: 11.5px; color: var(--ink-soft); }
  .subtitle b { color: var(--blue-deep); font-weight: 600; }
  .body { margin: 2px 0 0; font-size: 11px; color: var(--muted); }

  .demo { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .demo span { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .demo .dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--hair-strong); background: transparent; cursor: pointer; padding: 0; transition: all 150ms var(--ease); }
  .demo .dot[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); }

  .panel.leaving { transform: scale(.95); opacity: 0; filter: blur(2px); }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<main class="panel listening" id="panel" aria-label="语音助手：抖动点阵球">
  <div class="content">
    <div class="top">
      <span class="kicker">Workfiles</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="primary" aria-label="开始或停止" title="开始 / 停止">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <button class="icon-btn" id="cancel" aria-label="取消" title="取消（Esc）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg>
      </button>
    </div>

    <div class="stage">
      <span class="halo" aria-hidden="true"></span>
      <canvas id="sphere" width="196" height="196" aria-hidden="true"></canvas>
    </div>

    <div class="copy">
      <h1 class="title" id="title">我在听</h1>
      <p class="subtitle" id="subtitle">收听中 · 停顿约 1 秒自动提交</p>
      <p class="body" id="body">点阵球只有两色：亮面落蓝点，暗面落墨点</p>
    </div>

    <div class="demo" role="group" aria-label="状态演示（仅概念稿）">
      <span>演示</span>
      <button class="dot" data-state="listening" aria-pressed="true" aria-label="收听"></button>
      <button class="dot" data-state="thinking" aria-pressed="false" aria-label="思考"></button>
      <button class="dot" data-state="processing" aria-pressed="false" aria-label="处理"></button>
      <button class="dot" data-state="done" aria-pressed="false" aria-label="完成"></button>
    </div>
  </div>
</main>

<script>
  const panel = document.getElementById('panel');
  const canvas = document.getElementById('sphere');
  const ctx = canvas.getContext('2d');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const body = document.getElementById('body');
  const dots = [...document.querySelectorAll('.demo .dot')];

  const COPY = {
    listening: ['我在听', '收听中 · 停顿约 1 秒自动提交', '点阵球只有两色：亮面落蓝点，暗面落墨点'],
    thinking: ['在想你要哪一份', '思考中 · 正在比对最近 7 天的线索', '旋涡把点阵卷起来，说明在检索而不是在收音'],
    processing: ['正在打开', '执行中 · 正在请求系统打开第一条', '一道扫描带推过球面，读作“正在执行”'],
    done: ['好了', '已完成 · 窗口即将收起', '点阵向外散开、变稀，表示任务结束'],
  };

  let state = 'listening';
  let started = performance.now();
  let dispersed = 0;

  /* Ordered 4×4 Bayer matrix — the same idea Paper's dithering shader uses:
     a continuous value is compared against a per-cell threshold. */
  const BAYER = [
    0, 8, 2, 10,
    12, 4, 14, 6,
    3, 11, 1, 9,
    15, 7, 13, 5,
  ].map(value => (value + 0.5) / 16);

  const CELL = 4;                 // pixel size of one dither cell
  const SIZE = 196;
  const half = SIZE / 2;
  const cols = Math.ceil(SIZE / CELL);

  function setState(next) {
    state = next;
    started = performance.now();
    dispersed = 0;
    panel.className = `panel ${next}`;
    title.textContent = COPY[next][0];
    subtitle.textContent = COPY[next][1];
    body.textContent = COPY[next][2];
    for (const dot of dots) dot.setAttribute('aria-pressed', String(dot.dataset.state === next));
    panel.classList.remove('leaving');
    if (next === 'done') setTimeout(() => panel.classList.add('leaving'), 1700);
  }

  // Sphere shading: Lambert on a unit sphere, then a state-specific field on top.
  function shade(nx, ny, nz, time) {
    if (state === 'listening') {
      // A light band drifts across; ripples radiate from the centre.
      const lx = Math.sin(time * 0.55) * 0.85, ly = -0.55, lz = 0.62;
      const lambert = Math.max(0, nx * lx + ny * ly + nz * lz);
      const ripple = Math.sin(Math.hypot(nx, ny) * 15 - time * 2.6) * 0.12;
      return lambert * 0.96 + ripple + 0.16;
    }
    if (state === 'thinking') {
      const angle = Math.atan2(ny, nx);
      const swirl = Math.sin(angle * 3 + Math.hypot(nx, ny) * 12 - time * 2.1) * 0.26;
      const lambert = Math.max(0, nx * 0.5 + ny * -0.4 + nz * 0.75);
      return lambert * 0.8 + swirl + 0.22;
    }
    if (state === 'processing') {
      const band = ((time * 0.7) % 2.4) - 0.7;
      const scan = Math.max(0, 1 - Math.abs(nx - band) * 3.4);
      const lambert = Math.max(0, nx * 0.15 + ny * -0.2 + nz * 0.95);
      return lambert * 0.62 + scan * 0.5 + 0.2;
    }
    // done: the field pulls outward and thins
    const radius = Math.hypot(nx, ny);
    const fade = Math.max(0, 1 - dispersed);
    const lambert = Math.max(0, nx * 0.35 + ny * -0.5 + nz * 0.8);
    return (lambert * 0.7 + 0.24) * fade * (1 - radius * 0.25);
  }

  function draw(now) {
    const time = (now - started) / 1000;
    if (state === 'done') dispersed = Math.min(1, dispersed + 0.012);

    ctx.clearRect(0, 0, SIZE, SIZE);
    // The ball keeps a single flat silhouette so the dots read as one object.
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(half, half, half - 2, 0, Math.PI * 2);
    ctx.fill();

    for (let gy = 0; gy < cols; gy++) {
      for (let gx = 0; gx < cols; gx++) {
        const px = gx * CELL + CELL / 2 - half;
        const py = gy * CELL + CELL / 2 - half;
        const nx = px / half, ny = py / half;
        const radius = Math.hypot(nx, ny);

        // Dissolve: dots drift outward in the done state.
        const drift = state === 'done' ? dispersed * 14 : 0;
        const spread = radius > 1 ? 0 : 1;

        if (radius > 1 + dispersed * 0.55 || !spread) continue;
        const nz = Math.sqrt(Math.max(0, 1 - radius * radius));
        const value = Math.min(1, Math.max(0, shade(nx, ny, nz, time)));
        const threshold = BAYER[(gy % 4) * 4 + (gx % 4)];

        const x = gx * CELL + CELL / 2 + (drift * nx);
        const y = gy * CELL + CELL / 2 + (drift * ny);
        const on = value > threshold;

        // Dots: ink on the dark side, blue where the light lands.
        if (on) {
          // Blue marks the lit side by absolute brightness, not relative to the cell
          // threshold — relative comparison speckles the highlight with ink dots.
          const lit = value > 0.72;
          ctx.fillStyle = lit ? 'rgba(77,107,254,0.95)' : 'rgba(15,17,21,0.92)';
          ctx.beginPath();
          ctx.arc(x, y, CELL * 0.44, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // A faint dot keeps the silhouette readable without filling the disc.
          ctx.fillStyle = `rgba(15,17,21,${(0.10 * value + 0.03).toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(x, y, CELL * 0.26, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    requestAnimationFrame(draw);
  }

  // Crisp dots on retina: draw at the device pixel ratio, keep the CSS box fixed.
  (() => {
    const ratio = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = SIZE * ratio;
    canvas.height = SIZE * ratio;
    canvas.style.width = `${SIZE}px`;
    canvas.style.height = `${SIZE}px`;
    ctx.scale(ratio, ratio);
  })();

  for (const dot of dots) dot.addEventListener('click', () => setState(dot.dataset.state));
  canvas.addEventListener('click', () => {
    const order = ['listening', 'thinking', 'processing', 'done'];
    setState(order[(order.indexOf(state) + 1) % order.length]);
  });
  addEventListener('keydown', event => {
    const map = { '1': 'listening', '2': 'thinking', '3': 'processing', '4': 'done' };
    if (map[event.key]) setState(map[event.key]);
    if (event.key === 'Escape') setState('done');
    if (event.key.toLowerCase() === 'r') setState('listening');
  });
  document.getElementById('cancel').addEventListener('click', () => setState('done'));
  document.getElementById('primary').addEventListener('click', () => setState(state === 'listening' ? 'thinking' : 'listening'));

  setState('listening');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) draw(performance.now());
  else requestAnimationFrame(draw);
</script>
</body>
</html>
