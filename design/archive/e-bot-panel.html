<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Panel · 单一窗口（纸感 + 机器人表情）</title>
<style>
  /* ONE surface: the window IS the card. Paper texture, dithered grain and the glass
     rim all live inside it, so nothing floats on a separate backdrop. */
  :root {
    color-scheme: light;
    --paper: #f4efe6;
    --paper-2: #ece5d8;
    --ink: #17140f;
    --ink-soft: #4c463d;
    --muted: #8b8377;
    --hair: rgb(23 20 15 / .12);
    --accent: #c2542c;
    --moss: #3a5c4d;
    --ease: cubic-bezier(.22,.61,.36,1);
    font-family: "SF Pro Text", -apple-system, "PingFang SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #d9d2c6;              /* only the demo desktop; the product has no backdrop */
  }

  /* ---------- the window ---------- */
  .panel {
    position: relative;
    width: 440px; height: 268px;
    border-radius: 26px;
    overflow: hidden;
    background:
      radial-gradient(120% 110% at 18% 6%, #fffdf8 0%, var(--paper) 42%, var(--paper-2) 100%);
    box-shadow:
      0 1px 0 rgb(255 255 255 / .85) inset,
      0 0 0 1px rgb(23 20 15 / .10),
      0 26px 56px -22px rgb(60 45 30 / .55);
    color: var(--ink);
    transition: transform 300ms var(--ease), opacity 300ms var(--ease), filter 300ms var(--ease);
  }
  /* dithered paper texture inside the window */
  .grain {
    position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgb(23 20 15 / .30) 1px, transparent 1.3px);
    background-size: 5px 5px;
    mix-blend-mode: multiply;
    /* Texture is strongest near the edges and calm behind the face, so the paper
       reads as material rather than a halftone screen behind the copy. */
    -webkit-mask-image: radial-gradient(130% 105% at 50% 38%, transparent 26%, #000 78%);
    mask-image: radial-gradient(130% 105% at 50% 38%, transparent 26%, #000 78%);
    animation: drift 22s linear infinite, breatheGrain 7s ease-in-out infinite alternate;
  }
  @keyframes drift { to { background-position: 5px 10px; } }
  @keyframes breatheGrain { from { opacity: .32; } to { opacity: .58; } }
  .rim { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .7), inset 0 -30px 50px -30px rgb(120 90 60 / .35); }

  .content { position: relative; display: flex; flex-direction: column; height: 100%; padding: 16px 18px 12px; }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; gap: 8px; }
  .kicker { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .spacer { flex: 1; }
  .icon-btn {
    display: grid; place-items: center; width: 26px; height: 26px; padding: 0;
    border: 1px solid var(--hair); border-radius: 50%; background: transparent; color: var(--ink-soft);
    cursor: pointer; transition: all 150ms var(--ease);
  }
  .icon-btn:hover { background: rgb(23 20 15 / .05); color: var(--ink); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* ---------- bot ---------- */
  .stage { position: relative; flex: 1; display: grid; place-items: center; margin-top: 2px; }
  .bot { position: relative; width: 108px; height: 92px; }

  /* head: rounded square with a soft inner light; one material, no gradient soup */
  .head {
    position: absolute; inset: 0;
    border-radius: 30% / 34%;
    background: linear-gradient(160deg, #2c2721 0%, #191510 62%, #0e0c09 100%);
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / .18),
      inset 0 -10px 18px rgb(0 0 0 / .5),
      0 14px 24px -12px rgb(40 28 18 / .7);
    transition: transform 260ms var(--ease), border-radius 360ms var(--ease), filter 260ms var(--ease);
  }
  /* antenna */
  .antenna { position: absolute; left: 50%; top: -13px; width: 2px; height: 13px; margin-left: -1px;
    background: linear-gradient(180deg, transparent, #2a251f); }
  .antenna::after { content: ""; position: absolute; left: -3px; top: -6px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px rgb(194 84 44 / .8); animation: blinkLight 2.4s var(--ease) infinite; }
  @keyframes blinkLight { 0%, 100% { opacity: 1; } 45%, 55% { opacity: .25; } }

  /* face: two eyes that carry every state */
  .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 17px; }
  .eye {
    position: relative; width: 30px; height: 30px; border-radius: 42% / 46%;
    background: #f7f3ea;
    box-shadow: inset 0 2px 6px rgb(0 0 0 / .35);
    transition: all 260ms var(--ease);
    overflow: hidden;
  }
  .pupil {
    position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: #17140f;
    transition: transform 320ms var(--ease), width 240ms var(--ease), height 240ms var(--ease), border-radius 240ms var(--ease);
  }
  .pupil::after { content: ""; position: absolute; left: 2px; top: 2px; width: 4px; height: 4px; border-radius: 50%; background: rgb(255 255 255 / .85); }
  /* a scan line lives inside the eye for the processing state */
  .scan { position: absolute; left: 0; right: 0; top: 0; height: 0; background: var(--accent); opacity: 0; }
  .mouth { position: absolute; left: 50%; bottom: 14px; width: 16px; height: 3px; margin-left: -8px; border-radius: 3px;
    background: rgb(247 243 234 / .55); transition: all 240ms var(--ease); }

  /* ---------- listening ---------- */
  .listening .head { animation: listenBob 2.8s var(--ease) infinite; }
  .listening .pupil { transform: scale(1.06); }
  .listening .mouth { width: 12px; }
  @keyframes listenBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(-1.5deg); }
  }
  .ear { position: absolute; width: 108px; height: 92px; border-radius: 30% / 34%; border: 1px solid rgb(58 92 77 / .28); opacity: 0; }
  .listening .ear { animation: ear 2.6s var(--ease) infinite; }
  .listening .ear:nth-of-type(2) { animation-delay: 1.3s; }
  @keyframes ear { from { transform: scale(1); opacity: .55; } to { transform: scale(1.42); opacity: 0; } }

  /* ---------- thinking ---------- */
  .thinking .head { animation: thinkTilt 2.2s var(--ease) infinite; border-radius: 34% / 30%; }
  .thinking .pupil { transform: translate(4px, -5px) scale(.92); }
  .thinking .eye:last-of-type .pupil { transform: translate(7px, -2px) scale(.8); }
  .thinking .mouth { width: 8px; }
  @keyframes thinkTilt {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-2px); }
  }
  .dots-orbit { position: absolute; width: 150px; height: 150px; opacity: 0; transition: opacity 200ms var(--ease); }
  .dots-orbit i { position: absolute; inset: 0; animation: spin 3.2s linear infinite; }
  .dots-orbit i::before { content: ""; position: absolute; left: calc(50% - 3px); top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--moss); }
  .dots-orbit i:nth-child(2) { animation-duration: 2.1s; animation-direction: reverse; }
  .dots-orbit i:nth-child(2)::before { background: var(--accent); }
  .thinking .dots-orbit { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- processing ---------- */
  .processing .head { animation: press 1s var(--ease) infinite; }
  .processing .eye { border-radius: 30% / 24%; }
  .processing .pupil { width: 20px; height: 6px; border-radius: 3px; transform: translateY(0); }
  .processing .pupil::after { display: none; }
  .processing .scan { height: 100%; opacity: .22; animation: scan 1.4s var(--ease) infinite; }
  @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
  @keyframes press { 0%, 100% { transform: scale(1, .98); } 50% { transform: scale(1.02, 1.02); } }

  /* ---------- done ---------- */
  .done .head { animation: hop 620ms var(--ease); }
  .done .eye { height: 16px; border-radius: 12px 12px 4px 4px; background: transparent; box-shadow: none;
    border-top: 4px solid #f7f3ea; }
  .done .pupil { display: none; }
  .done .mouth { width: 20px; height: 8px; border-radius: 0 0 12px 12px; background: transparent;
    border: 2.4px solid rgb(247 243 234 / .7); border-top: 0; }
  @keyframes hop { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-9px) scale(1.04); } 100% { transform: translateY(0) scale(1); } }
  .check { position: absolute; right: -26px; top: -6px; width: 26px; height: 26px; opacity: 0; transform: scale(.6);
    transition: opacity 200ms var(--ease), transform 240ms var(--ease); }
  .check path { fill: none; stroke: var(--moss); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 26; stroke-dashoffset: 26; }
  .done .check { opacity: 1; transform: scale(1); }
  .done .check path { animation: draw 380ms var(--ease) 140ms forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- copy ---------- */
  .copy { display: grid; gap: 3px; }
  .title { margin: 0; font-size: 17px; font-weight: 620; letter-spacing: -.015em; line-height: 1.3; }
  .subtitle { margin: 0; font-size: 11.5px; color: var(--ink-soft); }
  .body { margin: 3px 0 0; font-size: 11px; color: var(--muted); }

  /* ---------- demo controls (not part of the real product UI) ---------- */
  .demo { display: flex; align-items: center; gap: 6px; margin-top: 8px; opacity: .55; }
  .demo span { font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .demo .dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid rgb(23 20 15 / .3); background: transparent;
    cursor: pointer; padding: 0; transition: all 150ms var(--ease); }
  .demo .dot[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }

  .panel.leaving { transform: scale(.94); opacity: 0; filter: blur(2px); }

  @media (prefers-reduced-motion: reduce) {
    .grain, .head, .antenna::after, .ear, .dots-orbit i, .scan, .done .head { animation: none !important; }
    .grain { opacity: .42; }
    .panel, .head, .eye, .pupil, .mouth, .check { transition: none; }
  }
</style>
</head>
<body>
<main class="panel listening" id="panel" aria-label="语音助手：单一窗口 + 机器人表情">
  <div class="grain" aria-hidden="true"></div>
  <div class="rim" aria-hidden="true"></div>

  <div class="content">
    <div class="top">
      <span class="kicker">Workfiles</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="primary" aria-label="开始或停止" title="开始 / 停止">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <button class="icon-btn" id="cancel" aria-label="取消" title="取消（Esc）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg>
      </button>
    </div>

    <div class="stage">
      <span class="ear" aria-hidden="true"></span>
      <span class="ear" aria-hidden="true"></span>
      <div class="dots-orbit" aria-hidden="true"><i></i><i></i></div>
      <div class="bot" aria-hidden="true">
        <span class="antenna"></span>
        <div class="head">
          <div class="face">
            <span class="eye"><span class="pupil"></span><span class="scan"></span></span>
            <span class="eye"><span class="pupil"></span><span class="scan"></span></span>
          </div>
          <span class="mouth"></span>
        </div>
        <svg class="check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"></path></svg>
      </div>
    </div>

    <div class="copy">
      <h1 class="title" id="title">我在听</h1>
      <p class="subtitle" id="subtitle">收听中 · 停顿约 1 秒自动提交</p>
      <p class="body" id="body">试试说「打开我最近看过的三条推文」</p>
    </div>

    <div class="demo" role="group" aria-label="状态演示（仅概念稿）">
      <span>演示</span>
      <button class="dot" data-state="listening" aria-pressed="true" title="收听" aria-label="收听"></button>
      <button class="dot" data-state="thinking" aria-pressed="false" title="思考" aria-label="思考"></button>
      <button class="dot" data-state="processing" aria-pressed="false" title="处理" aria-label="处理"></button>
      <button class="dot" data-state="done" aria-pressed="false" title="完成" aria-label="完成"></button>
    </div>
  </div>
</main>

<script>
  const panel = document.getElementById('panel');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const body = document.getElementById('body');
  const dots = [...document.querySelectorAll('.demo .dot')];

  // The face carries the state; the copy only adds a short confirmation.
  const COPY = {
    listening: ['我在听', '收听中 · 停顿约 1 秒自动提交', '试试说「打开我最近看过的三条推文」'],
    thinking: ['在想你要哪一份', '思考中 · 正在比对最近 7 天的线索', '候选：三条推文，按观察时间排序'],
    processing: ['正在打开', '处理中 · 正在请求系统打开第一条', '系统接受请求后不代表窗口已经出现'],
    done: ['好了', '已完成 · 窗口即将收起', '已请求打开 · 你可以继续做别的事'],
  };

  let state = 'listening';

  function setState(next) {
    state = next;
    panel.className = `panel ${next}`;
    title.textContent = COPY[next][0];
    subtitle.textContent = COPY[next][1];
    body.textContent = COPY[next][2];
    for (const dot of dots) dot.setAttribute('aria-pressed', String(dot.dataset.state === next));
    panel.classList.remove('leaving');
    if (next === 'done') setTimeout(() => panel.classList.add('leaving'), 1500);
  }

  for (const dot of dots) dot.addEventListener('click', () => setState(dot.dataset.state));
  document.querySelector('.bot').addEventListener('click', () => {
    const order = ['listening', 'thinking', 'processing', 'done'];
    setState(order[(order.indexOf(state) + 1) % order.length]);
  });
  addEventListener('keydown', event => {
    const map = { '1': 'listening', '2': 'thinking', '3': 'processing', '4': 'done' };
    if (map[event.key]) setState(map[event.key]);
    if (event.key === 'Escape') setState('done');
    if (event.key.toLowerCase() === 'r') setState('listening');
  });
  document.getElementById('cancel').addEventListener('click', () => setState('done'));
  document.getElementById('primary').addEventListener('click', () => setState(state === 'listening' ? 'thinking' : 'listening'));

  setState('listening');
</script>
</body>
</html>
