<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dither Bot · 点阵质感的表情球</title>
<style>
  :root {
    color-scheme: light;
    --ground: #f6f7f9;
    --surface: #ffffff;
    --ink: #0f1115;
    --ink-soft: #3d434d;
    --muted: #767d89;
    --hair: rgb(15 17 21 / .09);
    --hair-strong: rgb(15 17 21 / .16);
    --blue: #4d6bfe;
    --blue-deep: #4176e6;
    --ease: cubic-bezier(.22,.61,.36,1);
    font-family: "SF Pro Text", -apple-system, "PingFang SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--ground); }

  .panel {
    position: relative; width: 432px; height: 288px; border-radius: 24px; overflow: hidden;
    background: var(--surface); color: var(--ink);
    box-shadow: 0 0 0 1px var(--hair), 0 18px 44px -20px rgb(15 17 21 / .28), 0 2px 8px rgb(15 17 21 / .04);
    transition: transform 300ms var(--ease), opacity 300ms var(--ease), filter 300ms var(--ease);
  }
  #ribbons { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .content { position: relative; display: flex; flex-direction: column; height: 100%; padding: 14px 16px 10px; }

  .top { display: flex; align-items: center; gap: 8px; }
  .kicker { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .spacer { flex: 1; }
  .icon-btn {
    display: grid; place-items: center; width: 26px; height: 26px; padding: 0;
    border: 1px solid var(--hair); border-radius: 50%; background: transparent; color: var(--ink-soft);
    cursor: pointer; transition: all 150ms var(--ease);
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--hair-strong); background: var(--ground); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 14px; height: 14px; }

  .stage { position: relative; flex: 1; display: grid; place-items: center; }
  #ball { display: block; width: 200px; height: 200px; cursor: pointer; }
  .halo { position: absolute; width: 200px; height: 200px; border-radius: 50%; box-shadow: 0 26px 40px -26px rgb(15 17 21 / .4); pointer-events: none; }

  .copy { display: grid; gap: 2px; }
  .title { margin: 0; font-size: 16.5px; font-weight: 620; letter-spacing: -.012em; }
  .subtitle { margin: 0; font-size: 11.5px; color: var(--ink-soft); }
  .subtitle b { color: var(--blue-deep); font-weight: 600; }
  .body { margin: 2px 0 0; font-size: 11px; color: var(--muted); }

  .demo { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .demo span { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .demo .dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--hair-strong); background: transparent; cursor: pointer; padding: 0; transition: all 150ms var(--ease); }
  .demo .dot[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); }

  .panel.leaving { transform: scale(.95); opacity: 0; filter: blur(2px); }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<main class="panel listening" id="panel" aria-label="语音助手：点阵表情球">
  <canvas id="ribbons" aria-hidden="true"></canvas>
  <div class="content">
    <div class="top">
      <span class="kicker">Workfiles</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="primary" aria-label="开始或停止" title="开始 / 停止">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <button class="icon-btn" id="cancel" aria-label="取消" title="取消（Esc）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg>
      </button>
    </div>

    <div class="stage">
      <span class="halo" aria-hidden="true"></span>
      <canvas id="ball" width="200" height="200" aria-label="机器人表情" role="img"></canvas>
    </div>

    <div class="copy">
      <h1 class="title" id="title">我在听</h1>
      <p class="subtitle" id="subtitle">收听中 · 停顿约 1 秒自动提交</p>
      <p class="body" id="body">整颗球是抖动点阵；眼睛是点阵里“留白”的形状</p>
    </div>

    <div class="demo" role="group" aria-label="状态演示（仅概念稿）">
      <span>演示</span>
      <button class="dot" data-state="listening" aria-pressed="true" aria-label="收听"></button>
      <button class="dot" data-state="thinking" aria-pressed="false" aria-label="思考"></button>
      <button class="dot" data-state="processing" aria-pressed="false" aria-label="处理"></button>
      <button class="dot" data-state="done" aria-pressed="false" aria-label="完成"></button>
    </div>
  </div>
</main>

<script>
  const panel = document.getElementById('panel');
  const canvas = document.getElementById('ball');
  const ctx = canvas.getContext('2d');
  const ribbonCanvas = document.getElementById('ribbons');
  const rctx = ribbonCanvas.getContext('2d');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const body = document.getElementById('body');
  const dots = [...document.querySelectorAll('.demo .dot')];

  const COPY = {
    listening: ['我在听', '收听中 · 停顿约 1 秒自动提交', '整颗球是抖动点阵；眼睛是点阵里“留白”的形状'],
    thinking: ['在想你要哪一份', '思考中 · 正在比对最近 7 天的线索', '点阵卷成旋涡，眼睛向上找答案'],
    processing: ['正在打开', '执行中 · 正在请求系统打开第一条', '扫描带推过球面，眼睛眯成一条线'],
    done: ['好了', '已完成 · 窗口即将收起', '点阵散开，眼睛弯成笑眼'],
  };

  // 4×4 ordered Bayer thresholds: one per dither cell.
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
  const CELL = 4, SIZE = 200, HALF = SIZE / 2, COLS = Math.ceil(SIZE / CELL);

  let state = 'listening';
  let started = performance.now();
  let dissolve = 0;

  /* Eye geometry per state, in normalized ball coordinates (radius = 1).
     Each eye is a white "hole" punched through the dot matrix, so the texture and the
     face are made of the same material. */
  function eyeShapes(time) {
    if (state === 'processing') {
      return [{ x: -0.34, y: 0.02, rx: 0.20, ry: 0.045 }, { x: 0.34, y: 0.02, rx: 0.20, ry: 0.045 }];
    }
    if (state === 'done') return [];   // smiling eyes are stroked on top, see below
    if (state === 'thinking') {
      // look up and to the right; the right eye squints
      return [{ x: -0.30, y: -0.10, rx: 0.14, ry: 0.19, tilt: -0.12 }, { x: 0.34, y: -0.06, rx: 0.12, ry: 0.14, tilt: 0.10 }];
    }
    // listening: tall, attentive eyes (a slow blink keeps it alive)
    const blink = Math.sin(time * 0.9) > 0.985 ? 0.30 : 1;
    return [{ x: -0.32, y: -0.03, rx: 0.145, ry: 0.20 * blink }, { x: 0.32, y: -0.03, rx: 0.145, ry: 0.20 * blink }];
  }

  function insideEye(nx, ny, eye) {
    let dx = nx - eye.x, dy = ny - eye.y;
    if (eye.tilt) {
      const cos = Math.cos(eye.tilt), sin = Math.sin(eye.tilt);
      const rx = dx * cos + dy * sin, ry = -dx * sin + dy * cos;
      dx = rx; dy = ry;
    }
    const big = (dx * dx) / (eye.rx * eye.rx) + (dy * dy) / (eye.ry * eye.ry) <= 1;
    if (!big) return false;
    if (eye.cut === undefined) return true;
    // subtract a lower ellipse to leave only the upper arc
    const cx = dx, cy = dy - eye.cut * 1.15;
    const small = (cx * cx) / (eye.rx * eye.rx) + (cy * cy) / (eye.ry * eye.ry) <= 1;
    return !small;
  }

  function shade(nx, ny, nz, time) {
    if (state === 'thinking') {
      const angle = Math.atan2(ny, nx);
      const swirl = Math.sin(angle * 3 + Math.hypot(nx, ny) * 12 - time * 2.2) * 0.26;
      const lambert = Math.max(0, nx * 0.45 + ny * -0.45 + nz * 0.77);
      return lambert * 0.82 + swirl + 0.22;
    }
    if (state === 'processing') {
      const band = ((time * 0.75) % 2.4) - 0.7;
      const scan = Math.max(0, 1 - Math.abs(nx - band) * 3.2);
      const lambert = Math.max(0, nx * 0.1 + ny * -0.15 + nz * 0.98);
      return lambert * 0.66 + scan * 0.46 + 0.2;
    }
    if (state === 'done') {
      const fade = Math.max(0, 1 - dissolve);
      const lambert = Math.max(0, nx * 0.3 + ny * -0.5 + nz * 0.82);
      return (lambert * 0.7 + 0.26) * fade;
    }
    const lx = Math.sin(time * 0.5) * 0.8, ly = -0.5, lz = 0.66;
    const lambert = Math.max(0, nx * lx + ny * ly + nz * lz);
    const ripple = Math.sin(Math.hypot(nx, ny) * 14 - time * 2.4) * 0.12;
    return lambert * 0.96 + ripple + 0.16;
  }

  function drawBall(now) {
    const time = (now - started) / 1000;
    if (state === 'done') dissolve = Math.min(1, Math.max(0, (time - 0.7)) * 0.55);
    const eyes = eyeShapes(time);
    // gentle body motion; the dots move with it so the ball feels physical
    const bobY = state === 'listening' ? Math.sin(time * 1.6) * 1.6 : state === 'processing' ? Math.sin(time * 5) * 1.1 : 0;
    const tilt = state === 'thinking' ? Math.sin(time * 2.2) * 0.03 : 0;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.translate(HALF, HALF + bobY);
    ctx.rotate(tilt);
    ctx.translate(-HALF, -HALF);

    for (let gy = 0; gy < COLS; gy++) {
      for (let gx = 0; gx < COLS; gx++) {
        const px = gx * CELL + CELL / 2 - HALF;
        const py = gy * CELL + CELL / 2 - HALF;
        const nx = px / HALF, ny = py / HALF;
        const radius = Math.hypot(nx, ny);
        // The ball keeps its silhouette while finishing: dots drop out instead of drifting
        // outward (moving them turned the disc into a square grid).
        if (radius > 1) continue;
        if (state === 'done') {
          const drop = ((gx * 37 + gy * 91) % 100) / 100;
          if (drop < dissolve * 0.92) continue;
        }
        // eyes are punched out of the matrix — same material, no overlay shapes
        if (eyes.some(eye => insideEye(nx, ny, eye))) continue;

        const nz = Math.sqrt(Math.max(0, 1 - Math.min(1, radius * radius)));
        const value = Math.min(1, Math.max(0, shade(nx, ny, nz, time)));
        const threshold = BAYER[(gy % 4) * 4 + (gx % 4)];
        const x = gx * CELL + CELL / 2;
        const y = gy * CELL + CELL / 2;
        const fade = state === 'done' ? Math.max(0, 1 - dissolve * 0.85) : 1;

        if (value > threshold) {
          ctx.fillStyle = value > 0.74 ? `rgba(77,107,254,${(0.95 * fade).toFixed(3)})` : `rgba(15,17,21,${(0.92 * fade).toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(x, y, CELL * 0.44, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = `rgba(15,17,21,${((0.09 * value + 0.03) * (state === 'done' ? Math.max(0, 1 - dissolve * 0.85) : 1)).toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(x, y, CELL * 0.26, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    if (state === 'done') {
      const fade = Math.max(0, 1 - dissolve * 0.8);
      ctx.strokeStyle = `rgba(15,17,21,${(0.92 * fade).toFixed(3)})`;
      ctx.lineWidth = 4.6;
      ctx.lineCap = 'round';
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(HALF + side * 0.32 * HALF, HALF + 0.04 * HALF, 0.15 * HALF, Math.PI * 1.12, Math.PI * 1.88);
        ctx.stroke();
      }
    }
    requestAnimationFrame(drawBall);
  }

  /* ---------- blue ribbons while executing (Grok's "tricks") ---------- */
  const ribbons = [];
  let spawnRate = 0;
  function spawn(count, burst) {
    const w = panel.clientWidth, h = panel.clientHeight;
    for (let i = 0; i < count; i++) {
      ribbons.push({
        x: w / 2 + (Math.random() - 0.5) * 70, y: h * 0.42 + (Math.random() - 0.5) * 30,
        vx: (Math.random() - 0.5) * (burst ? 2.6 : 0.7), vy: burst ? -1.8 - Math.random() * 2 : -0.35 - Math.random() * 0.6,
        w: 4 + Math.random() * 8, h: 2 + Math.random() * 2, rot: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 0.24,
        life: 0, ttl: burst ? 1500 + Math.random() * 900 : 2400 + Math.random() * 1400,
        color: ['#4d6bfe', '#8aa2ff', '#b7c8fe', '#0f1115'][(Math.random() * 4) | 0], sway: Math.random() * 7,
      });
    }
  }
  let last = performance.now();
  function drawRibbons(now) {
    const dt = Math.min(48, now - last); last = now;
    const w = panel.clientWidth, h = panel.clientHeight;
    rctx.clearRect(0, 0, w, h);
    if (spawnRate && Math.random() < spawnRate * (dt / 16)) spawn(1, false);
    for (let i = ribbons.length - 1; i >= 0; i--) {
      const r = ribbons[i];
      r.life += dt;
      if (r.life > r.ttl) { ribbons.splice(i, 1); continue; }
      r.vy += 0.012 * (dt / 16); r.sway += 0.06 * (dt / 16);
      r.x += (r.vx + Math.sin(r.sway) * 0.3) * (dt / 16);
      r.y += r.vy * (dt / 16);
      r.rot += r.spin * (dt / 16);
      const fade = Math.max(0, 1 - r.life / r.ttl);
      rctx.save(); rctx.translate(r.x, r.y); rctx.rotate(r.rot);
      rctx.globalAlpha = fade * 0.92; rctx.fillStyle = r.color;
      rctx.fillRect(-r.w / 2, -r.h / 2, r.w, r.h * (0.4 + Math.abs(Math.sin(r.rot)) * 0.9));
      rctx.restore();
    }
    requestAnimationFrame(drawRibbons);
  }

  const ratio = Math.min(window.devicePixelRatio || 1, 3);
  (() => {
    canvas.width = SIZE * ratio; canvas.height = SIZE * ratio;
    canvas.style.width = `${SIZE}px`; canvas.style.height = `${SIZE}px`;
    const box = panel.getBoundingClientRect();
    ribbonCanvas.width = Math.floor(box.width * ratio);
    ribbonCanvas.height = Math.floor(box.height * ratio);
    rctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  })();

  function setState(next) {
    state = next;
    started = performance.now();
    dissolve = 0;
    spawnRate = next === 'processing' ? 0.45 : 0;
    panel.className = `panel ${next}`;
    title.textContent = COPY[next][0];
    subtitle.textContent = COPY[next][1];
    body.textContent = COPY[next][2];
    for (const dot of dots) dot.setAttribute('aria-pressed', String(dot.dataset.state === next));
    panel.classList.remove('leaving');
    if (next === 'done') {
      spawn(24, true);
      setTimeout(() => panel.classList.add('leaving'), 1700);
    }
  }

  for (const dot of dots) dot.addEventListener('click', () => setState(dot.dataset.state));
  canvas.addEventListener('click', () => {
    const order = ['listening', 'thinking', 'processing', 'done'];
    setState(order[(order.indexOf(state) + 1) % order.length]);
  });
  addEventListener('keydown', event => {
    const map = { '1': 'listening', '2': 'thinking', '3': 'processing', '4': 'done' };
    if (map[event.key]) setState(map[event.key]);
    if (event.key === 'Escape') setState('done');
    if (event.key.toLowerCase() === 'r') setState('listening');
  });
  document.getElementById('cancel').addEventListener('click', () => setState('done'));
  document.getElementById('primary').addEventListener('click', () => setState(state === 'listening' ? 'thinking' : 'listening'));

  setState('listening');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) drawBall(performance.now());
  else { requestAnimationFrame(drawBall); requestAnimationFrame(drawRibbons); }
</script>
</body>
</html>
