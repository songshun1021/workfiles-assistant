<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Bot · 单一窗口（点阵背景 + 表情球）</title>
<style>
  /* One surface only: this window is the card. The paper ground and its ordered-dither
     texture live INSIDE the window; nothing floats on a separate backdrop.
     There is no product copy: the face alone reports the state. */
  :root {
    color-scheme: light;
    --ground: #e4e6ea;
    --paper: #f7f7f9;
    --paper-2: #eceef2;
    --ink: #16130f;
    --ink-soft: #4c463d;
    --hair: rgb(23 20 15 / .12);
    --accent: #4d6bfe;
    --ease: cubic-bezier(.22,.61,.36,1);
    font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--ground); }

  .window {
    position: relative; width: 340px; height: 244px; border-radius: 26px; overflow: hidden;
    background: radial-gradient(130% 120% at 22% 8%, #ffffff 0%, var(--paper) 46%, var(--paper-2) 100%);
    box-shadow:
      0 1px 0 rgb(255 255 255 / .9) inset,
      0 0 0 1px rgb(23 20 15 / .10),
      0 26px 56px -24px rgb(20 24 35 / .38);
    transition: transform 320ms var(--ease), opacity 320ms var(--ease), filter 320ms var(--ease);
  }
  /* ordered-dither paper texture, breathing, calm behind the face */
  #paper { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .30; pointer-events: none;
    -webkit-mask-image: radial-gradient(120% 100% at 50% 46%, transparent 22%, #000 76%);
    mask-image: radial-gradient(120% 100% at 50% 46%, transparent 22%, #000 76%); }
  .rim { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .65), inset 0 -26px 44px -28px rgb(120 90 60 / .32); }

  .controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
  .icon-btn {
    display: grid; place-items: center; width: 24px; height: 24px; padding: 0;
    border: 1px solid var(--hair); border-radius: 50%; background: rgb(255 255 255 / .5);
    color: var(--ink-soft); cursor: pointer; transition: all 150ms var(--ease);
  }
  .icon-btn:hover { background: #fff; color: var(--ink); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 13px; height: 13px; }

  .stage { position: absolute; inset: 0; display: grid; place-items: center; }
  #face { display: block; width: 176px; height: 176px; cursor: pointer; }

  /* finished: the whole window shrinks away, reading as “about to disappear” */
  .window.leaving { transform: scale(.94); opacity: 0; filter: blur(2px); }

  @media (prefers-reduced-motion: reduce) { .window { transition: none; } }
</style>
</head>
<body>
<main class="window listening" id="window" aria-label="语音助手：纸感点阵 + 表情球">
  <canvas id="paper" aria-hidden="true"></canvas>
  <div class="rim" aria-hidden="true"></div>

  <div class="controls">
    <button class="icon-btn" id="primary" aria-label="开始或停止" title="开始 / 停止">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <button class="icon-btn" id="cancel" aria-label="取消" title="取消（Esc）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg>
    </button>
  </div>

  <div class="stage">
    <canvas id="face" width="176" height="176" role="img" aria-label="机器人表情：收听中"></canvas>
  </div>
</main>

<script>
  const win = document.getElementById('window');
  const paperCanvas = document.getElementById('paper');
  const faceCanvas = document.getElementById('face');
  const paperCtx = paperCanvas.getContext('2d');
  const faceCtx = faceCanvas.getContext('2d');

  // 4×4 ordered Bayer thresholds: one per dither cell, for both the paper and the ball.
  const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
  const BAYER8 = [
    0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26,
    12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
    3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
    15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21,
  ].map(v => (v + 0.5) / 64);

  const FACE = 176, FHALF = FACE / 2, FCELL = 4, FCOLS = Math.ceil(FACE / FCELL);
  const ratio = Math.min(window.devicePixelRatio || 1, 3);
  let state = 'listening';
  let started = performance.now();
  let dissolve = 0;

  /* ---------- the ball: dotted sphere with eyes punched out of the matrix ---------- */
  function eyeShapes(time) {
    if (state === 'processing') {
      return [{ x: -0.34, y: 0.02, rx: 0.20, ry: 0.045 }, { x: 0.34, y: 0.02, rx: 0.20, ry: 0.045 }];
    }
    if (state === 'done') return [];  // smiling eyes are stroked on top
    if (state === 'thinking') {
      return [{ x: -0.30, y: -0.10, rx: 0.14, ry: 0.19, tilt: -0.12 }, { x: 0.34, y: -0.06, rx: 0.12, ry: 0.14, tilt: 0.10 }];
    }
    const blink = Math.sin(time * 0.9) > 0.985 ? 0.30 : 1;
    return [{ x: -0.32, y: -0.03, rx: 0.145, ry: 0.20 * blink }, { x: 0.32, y: -0.03, rx: 0.145, ry: 0.20 * blink }];
  }

  function insideEye(nx, ny, eye) {
    let dx = nx - eye.x, dy = ny - eye.y;
    if (eye.tilt) {
      const cos = Math.cos(eye.tilt), sin = Math.sin(eye.tilt);
      const tx = dx * cos + dy * sin; dy = -dx * sin + dy * cos; dx = tx;
    }
    return (dx * dx) / (eye.rx * eye.rx) + (dy * dy) / (eye.ry * eye.ry) <= 1;
  }

  function shade(nx, ny, nz, time) {
    if (state === 'thinking') {
      const angle = Math.atan2(ny, nx);
      const swirl = Math.sin(angle * 3 + Math.hypot(nx, ny) * 12 - time * 2.2) * 0.26;
      const lambert = Math.max(0, nx * 0.45 + ny * -0.45 + nz * 0.77);
      return lambert * 0.82 + swirl + 0.22;
    }
    if (state === 'processing') {
      const band = ((time * 0.75) % 2.4) - 0.7;
      const scan = Math.max(0, 1 - Math.abs(nx - band) * 3.2);
      const lambert = Math.max(0, nx * 0.1 + ny * -0.15 + nz * 0.98);
      return lambert * 0.66 + scan * 0.46 + 0.2;
    }
    if (state === 'done') {
      const fade = Math.max(0, 1 - dissolve);
      const lambert = Math.max(0, nx * 0.3 + ny * -0.5 + nz * 0.82);
      return (lambert * 0.7 + 0.26) * fade;
    }
    const lx = Math.sin(time * 0.5) * 0.8, ly = -0.5, lz = 0.66;
    const lambert = Math.max(0, nx * lx + ny * ly + nz * lz);
    const ripple = Math.sin(Math.hypot(nx, ny) * 14 - time * 2.4) * 0.12;
    return lambert * 0.96 + ripple + 0.16;
  }

  function drawFace(now) {
    const time = (now - started) / 1000;
    if (state === 'done') dissolve = Math.min(1, Math.max(0, time - 0.7) * 0.55);
    const eyes = eyeShapes(time);
    const bob = state === 'listening' ? Math.sin(time * 1.6) * 1.4 : state === 'processing' ? Math.sin(time * 5) * 1 : 0;
    const tilt = state === 'thinking' ? Math.sin(time * 2.2) * 0.03 : 0;

    faceCtx.setTransform(1, 0, 0, 1, 0, 0);
    faceCtx.clearRect(0, 0, faceCanvas.width, faceCanvas.height);
    faceCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
    faceCtx.translate(FHALF, FHALF + bob);
    faceCtx.rotate(tilt);
    faceCtx.translate(-FHALF, -FHALF);

    const fade = state === 'done' ? Math.max(0, 1 - dissolve * 0.85) : 1;
    for (let gy = 0; gy < FCOLS; gy++) {
      for (let gx = 0; gx < FCOLS; gx++) {
        const px = gx * FCELL + FCELL / 2 - FHALF;
        const py = gy * FCELL + FCELL / 2 - FHALF;
        const nx = px / FHALF, ny = py / FHALF;
        if (Math.hypot(nx, ny) > 1) continue;
        if (state === 'done' && ((gx * 37 + gy * 91) % 100) / 100 < dissolve * 0.9) continue;
        if (eyes.some(eye => insideEye(nx, ny, eye))) continue;

        const nz = Math.sqrt(Math.max(0, 1 - (nx * nx + ny * ny)));
        const value = Math.min(1, Math.max(0, shade(nx, ny, nz, time)));
        const on = value > BAYER4[(gy % 4) * 4 + (gx % 4)];
        const x = gx * FCELL + FCELL / 2, y = gy * FCELL + FCELL / 2;
        if (on) {
          faceCtx.fillStyle = value > 0.74 ? `rgba(77,107,254,${(0.95 * fade).toFixed(3)})` : `rgba(20,22,28,${(0.92 * fade).toFixed(3)})`;
          faceCtx.beginPath(); faceCtx.arc(x, y, FCELL * 0.44, 0, Math.PI * 2); faceCtx.fill();
        } else {
          faceCtx.fillStyle = `rgba(22,19,15,${((0.09 * value + 0.03) * fade).toFixed(3)})`;
          faceCtx.beginPath(); faceCtx.arc(x, y, FCELL * 0.25, 0, Math.PI * 2); faceCtx.fill();
        }
      }
    }

    // finished: two smiling arcs stay readable while the dots dissolve
    if (state === 'done') {
      faceCtx.strokeStyle = `rgba(22,19,15,${(0.9 * Math.max(0, 1 - dissolve * 0.8)).toFixed(3)})`;
      faceCtx.lineWidth = 4.4; faceCtx.lineCap = 'round';
      for (const side of [-1, 1]) {
        faceCtx.beginPath();
        faceCtx.arc(FHALF + side * 0.32 * FHALF, FHALF + 0.04 * FHALF, 0.15 * FHALF, Math.PI * 1.12, Math.PI * 1.88);
        faceCtx.stroke();
      }
    }
    requestAnimationFrame(drawFace);
  }

  /* ---------- paper: the same dither idea, as a breathing ground ---------- */
  const paper = { ctx: null, img: null, cols: 0, rows: 0, cell: 5, buffer: document.createElement('canvas') };
  function resizePaper() {
    const width = Math.floor(win.clientWidth * ratio), height = Math.floor(win.clientHeight * ratio);
    paperCanvas.width = width; paperCanvas.height = height;
    paper.cell = Math.max(3, Math.round(4 * ratio));
    paper.cols = Math.ceil(width / paper.cell); paper.rows = Math.ceil(height / paper.cell);
    paper.ctx = paperCanvas.getContext('2d', { alpha: true });
    paper.buffer.width = paper.cols; paper.buffer.height = paper.rows;
    paper.bufferCtx = paper.buffer.getContext('2d');
    paper.img = paper.bufferCtx.createImageData(paper.cols, paper.rows);
  }

  function drawPaper(now) {
    const time = (now - started) / 1000;
    const data = paper.img.data;
    let index = 0;
    for (let y = 0; y < paper.rows; y++) {
      for (let x = 0; x < paper.cols; x++) {
        const nx = x / paper.cols, ny = y / paper.rows;
        const radius = Math.hypot(nx - 0.5, ny - 0.48);
        const base = 0.5 + 0.5 * Math.sin(radius * 16 - time * 0.55);
        const sway = 0.1 * Math.sin(nx * 7 + time * 0.4) * Math.cos(ny * 6 - time * 0.3);
        const calm = Math.min(1, Math.max(0, radius * 2.6 - 0.6));
        const value = Math.min(1, Math.max(0, (base * 0.7 + sway + 0.2) * calm));
        const on = value > BAYER8[(y % 8) * 8 + (x % 8)];
        data[index++] = 24; data[index++] = 26; data[index++] = 32;
        data[index++] = on ? 120 : 0;
      }
    }
    paper.bufferCtx.putImageData(paper.img, 0, 0);
    paper.ctx.clearRect(0, 0, paperCanvas.width, paperCanvas.height);
    paper.ctx.imageSmoothingEnabled = false;
    paper.ctx.drawImage(paper.buffer, 0, 0, paper.cols, paper.rows, 0, 0, paper.cols * paper.cell, paper.rows * paper.cell);
    requestAnimationFrame(drawPaper);
  }

  /* ---------- state ---------- */
  const label = { listening: '收听中', thinking: '思考中', processing: '执行中', done: '已完成' };
  function setState(next) {
    state = next;
    started = performance.now();
    dissolve = 0;
    win.className = `window ${next}`;
    faceCanvas.setAttribute('aria-label', `机器人表情：${label[next]}`);
    win.classList.remove('leaving');
    if (next === 'done') setTimeout(() => win.classList.add('leaving'), 1700);
  }
  const order = ['listening', 'thinking', 'processing', 'done'];

  document.getElementById('face').addEventListener('click', () => setState(order[(order.indexOf(state) + 1) % order.length]));
  addEventListener('keydown', event => {
    const map = { '1': 'listening', '2': 'thinking', '3': 'processing', '4': 'done' };
    if (map[event.key]) setState(map[event.key]);
    if (event.key === 'Escape') setState('done');
    if (event.key.toLowerCase() === 'r') setState('listening');
  });
  document.getElementById('cancel').addEventListener('click', () => setState('done'));
  document.getElementById('primary').addEventListener('click', () => setState(state === 'listening' ? 'thinking' : 'listening'));
  addEventListener('resize', resizePaper);

  faceCanvas.width = FACE * ratio; faceCanvas.height = FACE * ratio;
  faceCanvas.style.width = `${FACE}px`; faceCanvas.style.height = `${FACE}px`;
  resizePaper();

  setState('listening');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { drawFace(performance.now()); drawPaper(performance.now()); }
  else { requestAnimationFrame(drawFace); requestAnimationFrame(drawPaper); }
</script>
</body>
</html>
