<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>工作文档 · 语音</title>
  <link rel="stylesheet" href="./panel.css">
  <script type="module" src="./panel.js"></script>
</head>
<body>
  <!-- One surface. The window supplies the material; this page paints only its tint,
       one specular rim and one soft inner light, so there is no second card anywhere.
       Three content roles are visible: title (what the user said / the result),
       subtitle (what is happening now), body (bounded detail). Everything else is an
       icon or motion. The orb is the only level meter and the only activity indicator,
       so the panel never shows two competing animations. -->
  <main class="voice-panel is-mounted" data-phase="ready" aria-label="工作文档语音助手">
    <div class="voice-orb" aria-hidden="true">
      <canvas id="orb"></canvas>
    </div>

    <div id="content" class="voice-content">
      <div id="thread" class="voice-thread" hidden></div>
      <div class="voice-line">
        <p id="echo" class="voice-title" aria-live="polite" aria-atomic="true" tabindex="0" hidden></p>
        <p id="error" class="voice-title voice-error" role="alert" tabindex="0" hidden></p>
        <span id="timer" class="voice-timer" hidden></span>
        <div class="voice-acts">
          <button id="more" class="voice-more" type="button" hidden>
            <span id="more-label">还有内容</span>
            <svg class="more-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <button id="typing-toggle" class="icon-button" type="button" aria-label="改用键盘输入" title="改用键盘输入" aria-expanded="false" aria-controls="text-form" disabled>
            <svg class="glyph glyph-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="2.2"></rect><path d="M7 11h.01M11 11h.01M15 11h.01M7 14.5h10"></path></svg>
          </button>
          <button id="cancel" class="icon-button" type="button" aria-label="取消" title="取消本次任务（Esc）" disabled>
            <svg class="glyph glyph-cancel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
            <svg class="glyph glyph-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10l6 6 6-6"></path></svg>
          </button>
          <button id="primary" class="icon-button" type="button" aria-label="开始说话" title="开始说话" disabled>
            <svg class="glyph glyph-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5.5 10.5v1a6.5 6.5 0 0 0 13 0v-1M12 18v3M9 21h6"></path></svg>
            <svg class="glyph glyph-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2.4"></rect></svg>
            <span class="glyph glyph-spinner" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <p id="status" class="voice-subtitle" role="status" aria-live="polite" aria-atomic="true">正在连接…</p>
      <p id="detail" class="voice-body" tabindex="0" hidden></p>
      <ul id="items" class="voice-items" aria-label="找到的资料" hidden></ul>

      <form id="text-form" class="text-form" hidden>
        <label class="sr-only" for="text-input">输入任务，按 Enter 或点击发送才会提交</label>
        <input id="text-input" type="text" maxlength="2000" autocomplete="off" spellcheck="false" placeholder="输入任务，按 Enter 发送" enterkeyhint="send">
        <button id="text-submit" class="primary" type="submit">发送</button>
      </form>

      <progress id="progress" aria-label="本地语音准备进度" max="1" hidden></progress>
      <meter id="level" class="sr-only" min="0" max="1" value="0" aria-label="麦克风音量" hidden></meter>
      <span id="hint" class="sr-only" hidden></span>
    </div>
  </main>
</body>
</html>
